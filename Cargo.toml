[workspace]
resolver = "2"
members = [
    "crates/worktree-protocol",
    "crates/worktree-server",
    "crates/worktree-bg",
    "crates/worktree-git",
    "crates/worktree-cli",
    "crates/worktree-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-W0rkTree-Public-License-1.0"

# Single source of truth for dependency versions. Crates inherit with
# `<dep>.workspace = true` and may add crate-specific features on top.
[workspace.dependencies]
# Internal crates
worktree-protocol = { path = "crates/worktree-protocol" }
worktree-git = { path = "crates/worktree-git" }
worktree-sdk = { path = "crates/worktree-sdk" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Wire protocol
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
tonic-build = "0.12"
protoc-bin-vendored = "3"

# Core primitives
blake3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI / filesystem
clap = { version = "4", features = ["derive"] }
colored = "2"
walkdir = "2"
notify = "7"

# Git interop
git2 = "0.19"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
