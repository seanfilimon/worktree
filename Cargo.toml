[workspace]
resolver = "2"
members = [
    "crates/worktree-protocol",
    "crates/worktree-bg",
    "crates/worktree-git",
    "crates/worktree-cli",
    "crates/worktree-sdk",
    "crates/worktree-e2e",
    "crates/worktree-bench",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "LicenseRef-W0rkTree-Public-License-1.0"

# Release binaries (wt, worktree-bg, worktree-bench): whole-program
# optimization across crates. Slower release builds, faster CPU-bound paths
# (JSON, protobuf, hashing glue, delta encoding) and smaller binaries.
[profile.release]
lto = "fat"
codegen-units = 1
