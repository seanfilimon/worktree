# Credentials from an existing Secret, data on an existing PVC, server-side
# TLS with mTLS, no ServiceAccount, no gRPC ingress (h2c-capable controller).
# expect: StatefulSet/wt-worktree, Ingress/wt-worktree, ConfigMap/wt-worktree
# expect-not: Secret/wt-worktree, ServiceAccount/wt-worktree, Ingress/wt-worktree-grpc
# expect-text: claimName: wt-data
# expect-text: name: my-worktree-credentials
# expect-text: WT_TLS_CERT: "/etc/worktree/tls/tls.crt"
# expect-text: WT_TLS_CLIENT_CA: "/etc/worktree/client-ca/ca.crt"
# expect-text: scheme: HTTPS
# expect-text: appProtocol: https
existingSecret: my-worktree-credentials
serviceAccount:
  create: false
persistence:
  existingClaim: wt-data
server:
  tls:
    enabled: true
    secretName: wt-server-tls
    clientCASecretName: wt-client-ca
ingress:
  enabled: true
  className: traefik
  grpc:
    enabled: false
tests:
  enabled: false
