{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worktree.fullname" . }}
  labels:
    {{- include "worktree.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "worktree.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.server.port }}
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        # Pods of this release: the backup CronJob and the helm test pod.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/part-of: worktree
      {{- end }}
  egress:
    {{- if $np.egress.allowAll }}
    - {}
    {{- else }}
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The server pods themselves.
    - to:
        - podSelector:
            matchLabels:
              {{- include "worktree.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.server.port }}
          protocol: TCP
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
