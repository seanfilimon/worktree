{{- if not .Values.existingSecret }}
{{- $name := include "worktree.fullname" . }}
{{- $keys := .Values.secretKeys }}
{{- /* Keep a generated admin password stable across upgrades. */}}
{{- $password := .Values.adminPassword }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey $existing "data") (hasKey $existing.data $keys.adminPassword) }}
{{- $password = index $existing.data $keys.adminPassword | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "worktree.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $keys.adminPassword }}: {{ $password | b64enc | quote }}
  {{- with .Values.s3.accessKey }}
  {{ $keys.s3AccessKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.s3.secretKey }}
  {{ $keys.s3SecretKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.smtp.url }}
  {{ $keys.smtpURL }}: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
