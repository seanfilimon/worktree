name: Release

# Pushing a tag like v0.1.0 (or v0.1.0-alpha.1) builds release binaries for
# every supported platform and publishes a GitHub Release with the archives
# and their SHA-256 checksums attached. Tags containing '-' are marked as
# pre-releases.
#
# Asset names are version-free (w0rktree-<target>.<ext>) so installers can
# always fetch `releases/latest/download/<asset>` without querying the API.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binaries
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p worktree-cli -p worktree-bg -p worktree-server

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="w0rktree-${{ matrix.target }}"
          staging="dist/${asset}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/wt" \
             "target/${{ matrix.target }}/release/worktree-bg" \
             "target/${{ matrix.target }}/release/worktree-server" \
             LICENSE README.md "${staging}/"
          tar -czf "dist/${asset}.tar.gz" -C dist "${asset}"
          rm -r "${staging}"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "w0rktree-${{ matrix.target }}"
          $staging = "dist/$asset"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/wt.exe",
                    "target/${{ matrix.target }}/release/worktree-bg.exe",
                    "target/${{ matrix.target }}/release/worktree-server.exe",
                    "LICENSE", "README.md" -Destination $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$asset.zip" -Force
          Remove-Item -Recurse -Force $staging
          $hash = (Get-FileHash "dist/$asset.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset.zip" | Out-File -Encoding ascii "dist/$asset.zip.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
