name: Deploy docs

# Deploys the website and docs (apps/web) to Railway after lint, link check
# and build pass. Needs the repository secret RAILWAY_TOKEN (a Railway
# project token for the production environment); without it the deploy job
# is skipped. Optional repository variable RAILWAY_DOCS_SERVICE (default
# "docs"). See docs/deploy-docs-site.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".railwayignore"
      - "scripts/deploy-docs.sh"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  RAILWAY_CLI_VERSION: 5.66.0

jobs:
  check:
    name: lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint --workspace=apps/web
      - name: build
        run: npm run build --workspace=apps/web

  deploy:
    name: deploy to Railway
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: docs-production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_DOCS_SERVICE: ${{ vars.RAILWAY_DOCS_SERVICE || 'docs' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: skip without RAILWAY_TOKEN
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::RAILWAY_TOKEN is not set; skipping the Railway deploy."
      - name: railway up
        if: env.RAILWAY_TOKEN != ''
        run: bash scripts/deploy-docs.sh deploy --no-check
