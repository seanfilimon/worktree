<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="W0rkTree server administration" />
    <title>W0rkTree Admin</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("wt.admin.theme") || "system";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
