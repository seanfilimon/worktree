[package]
name = "worktree-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load generator for the W0rkTree server: concurrent pushes, clones and code searches with latency/throughput reports"
publish = false

[[bin]]
name = "worktree-bench"
path = "src/main.rs"

[dependencies]
worktree-sdk = { path = "../worktree-sdk" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
