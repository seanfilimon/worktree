[package]
name = "worktree-bg"
version = "0.8.0"
edition = "2021"
description = "W0rkTree local background daemon: watches worktrees and takes auto-snapshots"

[[bin]]
name = "worktree-bg"
path = "src/main.rs"

[dependencies]
worktree-sdk = { path = "../worktree-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# tests/sync_loop.rs reuses the SDK's in-process fake server
# (crates/worktree-sdk/tests/remote_fake_server).
worktree-protocol = { path = "../worktree-protocol" }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.14"
tokio-stream = "0.1"
blake3 = "1"
uuid = { version = "1", features = ["v4"] }
