[package]
name = "worktree-bg"
version = "0.1.0"
edition = "2021"
description = "W0rkTree local background daemon: watches worktrees and takes auto-snapshots"

[[bin]]
name = "worktree-bg"
path = "src/main.rs"

[dependencies]
worktree-sdk = { path = "../worktree-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
