[package]
name = "worktree-server"
version = "0.1.0"
edition = "2021"
description = "Worktree server — background daemon for version control"

[[bin]]
name = "worktree-server"
path = "src/main.rs"

[dependencies]
worktree-protocol = { path = "../worktree-protocol" }
worktree-git = { path = "../worktree-git" }
worktree-sdk = { path = "../worktree-sdk" }
blake3 = "1"
axum = { version = "0.7", features = ["macros"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"
notify = "7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
