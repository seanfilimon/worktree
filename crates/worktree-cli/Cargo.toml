[package]
name = "worktree-cli"
version = "0.1.0"
edition = "2021"
description = "CLI client for the Worktree version control system"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
worktree-sdk = { path = "../worktree-sdk" }
worktree-git = { path = "../worktree-git" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
