[package]
name = "worktree-cli"
version = "0.8.0"
edition = "2021"
description = "CLI client for the Worktree version control system"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
worktree-sdk = { path = "../worktree-sdk" }
worktree-git = { path = "../worktree-git" }
# config-as-code (§16.3): .wt-tree validation (config::as_code).
worktree-protocol = { path = "../worktree-protocol" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false }
# cli-ux (§14.8): `wt completions`.
clap_complete = "=4.6.11"

# daemon (§13.11): keep `wt`'s own stdio handles out of the detached daemon.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# --- cli-iam: in-process fake REST server for tests/iam.rs ---
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
