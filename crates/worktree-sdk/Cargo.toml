[package]
name = "worktree-sdk"
version = "0.8.0"
edition = "2021"
description = "SDK for the Worktree version control system"

[dependencies]
worktree-protocol = { path = "../worktree-protocol" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
walkdir = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
prost = "0.13"
prost-types = "0.13"
ignore = "0.4"

# --- storage (ENGINEERING_PLAN §14.6): WTZ1 zstd object encoding ---
zstd = { version = "0.13", default-features = false }

# --- signing (ENGINEERING_PLAN §13.6): Ed25519 snapshot signatures ---
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = "0.10.9"
base64 = "0.22.1"

# --- sdk-remote: gRPC + REST client for the W0rkTree server ---
tonic = { version = "0.12", features = ["tls", "tls-native-roots", "tls-webpki-roots", "gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
# --- sdk-remote: in-process fake server for tests/remote_*.rs ---
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio"] }
