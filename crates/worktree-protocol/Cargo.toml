[package]
name = "worktree-protocol"
version = "0.8.0"
edition = "2021"
description = "Protocol definitions for the Worktree version control system"

[dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
prost = "0.13"
prost-types = "0.13"
tonic = "0.12"
# access workstream: declarative access compiler (src/access/declarative.rs)
toml = "1.1"
serde_json = "1"
# pack-delta (ENGINEERING_PLAN §16.1): zstd pack payloads (src/pack/)
zstd = { version = "0.13", default-features = false }
# config-as-code workstream: span-preserving parser for located diagnostics
# (src/config/as_code.rs); already in the tree through `toml`.
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
