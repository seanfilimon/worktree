version: v2
plugins:
  # Go message types.
  - local: protoc-gen-go
    out: ../../../services/server-go/internal/proto/syncpb
    opt:
      - paths=source_relative

  # Go gRPC service definitions.
  - local: protoc-gen-go-grpc
    out: ../../../services/server-go/internal/proto/syncpb
    opt:
      - paths=source_relative

# Rust codegen runs separately via tonic-build (crates/worktree-protocol/build.rs).
# buf doesn't need to invoke it.
