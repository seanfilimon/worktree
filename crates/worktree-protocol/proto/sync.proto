syntax = "proto3";

// W0rkTree sync protocol — wire format for communication between
// the local bgprocess (worktree-bg) and the remote server (worktree-server,
// future Go impl at services/server-go/).
//
// Mirrors the hand-coded Rust types in
//   crates/worktree-protocol/src/feature/sync_protocol.rs
// which remain alongside this codegen output during the WT-PROTO-* migration.
//
// Conventions: see crates/worktree-protocol/proto/CONVENTIONS.md
//   - all IDs are wrapped messages (cross-language type safety)
//   - field tag 100-199 is reserved on every message for additive expansion
//   - timestamps use google.protobuf.Timestamp
//   - payload-bearing Rust enums map to proto `oneof`; unit-only Rust enums
//     map to proto `enum` with _UNSPECIFIED = 0.

package worktree.sync.v1;

option go_package = "github.com/seanfilimon/worktree/services/server-go/internal/proto/syncpb";

import "google/protobuf/timestamp.proto";

// ============================================================
// ID types (wrapped for cross-language type safety)
// ============================================================

// Unique identifier for a worktree.
message TreeId {
  string value = 1;

  reserved 100 to 199;
}

// Unique identifier for a snapshot.
message SnapshotId {
  string value = 1;

  reserved 100 to 199;
}

// Unique identifier for a branch.
message BranchId {
  string value = 1;

  reserved 100 to 199;
}

// Unique identifier for a tenant in multi-tenant setups.
message TenantId {
  string value = 1;

  reserved 100 to 199;
}

// Unique identifier for a user account.
message AccountId {
  string value = 1;

  reserved 100 to 199;
}

// BLAKE3 content hash — 32 bytes.
message ContentHash {
  bytes value = 1;

  reserved 100 to 199;
}

// ============================================================
// Sync message-type enum (envelope discriminator)
// ============================================================

enum SyncMessageType {
  SYNC_MESSAGE_TYPE_UNSPECIFIED = 0;

  // Staged snapshot sync
  SYNC_MESSAGE_TYPE_STAGE_UPLOAD = 1;
  SYNC_MESSAGE_TYPE_STAGE_ACK = 2;

  // Branch push/pull
  SYNC_MESSAGE_TYPE_PUSH_REQUEST = 3;
  SYNC_MESSAGE_TYPE_PUSH_RESPONSE = 4;
  SYNC_MESSAGE_TYPE_PULL_REQUEST = 5;
  SYNC_MESSAGE_TYPE_PULL_RESPONSE = 6;

  // Object transfer
  SYNC_MESSAGE_TYPE_HAVE_WANT = 7;
  SYNC_MESSAGE_TYPE_OBJECT_TRANSFER = 8;

  // Access config sync
  SYNC_MESSAGE_TYPE_ACCESS_CONFIG_SYNC = 9;

  // Tag sync
  SYNC_MESSAGE_TYPE_TAG_SYNC = 10;

  // Chunk transfer (large files)
  SYNC_MESSAGE_TYPE_CHUNK_UPLOAD = 11;
  SYNC_MESSAGE_TYPE_CHUNK_DOWNLOAD = 12;

  // Health
  SYNC_MESSAGE_TYPE_PING = 13;
  SYNC_MESSAGE_TYPE_PONG = 14;
}

// ============================================================
// Have/Want negotiation (delta sync)
// ============================================================

// Client announces which objects it has.
message HaveMessage {
  repeated ContentHash hashes = 1;

  reserved 100 to 199;
}

// Client announces which objects it wants.
message WantMessage {
  repeated ContentHash hashes = 1;

  reserved 100 to 199;
}

// Server responds with the set of objects to transfer.
message ObjectTransferPlan {
  repeated ContentHash objects_to_send = 1;
  uint64 total_size = 2;

  reserved 100 to 199;
}

// Combined have/want negotiation request — sent by client; server replies
// with ObjectTransferPlan. The Rust side currently keeps HaveMessage and
// WantMessage as separate types (matched here) but the gRPC RPC takes them
// together for round-trip efficiency.
message NegotiateRequest {
  HaveMessage have = 1;
  WantMessage want = 2;

  reserved 100 to 199;
}

// ============================================================
// Push protocol
// ============================================================

// Request to push a branch tip to the server.
message PushRequest {
  TenantId tenant_id = 1;
  TreeId tree_id = 2;
  BranchId branch_id = 3;
  string branch_name = 4;
  optional SnapshotId old_tip = 5;
  SnapshotId new_tip = 6;
  repeated SnapshotId snapshot_chain = 7;
  AccountId account_id = 8;
  // Full records for every snapshot in `snapshot_chain` (oldest first).
  // Manifests and blobs they reference must already be uploaded via
  // UploadObjects before Push is called.
  repeated SnapshotRecord snapshots = 9;
  // v0.8 (§16.10): move the branch even when new_tip does not descend from
  // the server tip (needs branch:force_push and no no_force_push rule).
  bool force = 10;
  // v0.8 (§16.10): client-chosen idempotency key; a retried push with the
  // same id returns the first result.
  string operation_id = 11;

  reserved 100 to 199;
}

// Server response to a push.
message PushResponse {
  bool accepted = 1;
  optional PushRejection rejection_reason = 2;
  optional SnapshotId new_tip = 3;

  reserved 100 to 199;
}

// Reasons a push may be rejected. Sum type with per-variant payload —
// represented as a oneof per CONVENTIONS.md §3.
message PushRejection {
  oneof reason {
    ConflictDetected conflict_detected = 1;
    BranchProtection branch_protection = 2;
    AccessDenied access_denied = 3;
    LicenseViolation license_violation = 4;
    CiChecksFailed ci_checks_failed = 5;
    ReviewRequired review_required = 6;
    QuotaExceeded quota_exceeded = 7;
  }

  // The server tip moved since the client's last pull.
  message ConflictDetected {
    SnapshotId server_tip = 1;
    reserved 100 to 199;
  }

  // A branch protection rule rejected the push.
  message BranchProtection {
    string rule = 1;
    reserved 100 to 199;
  }

  // Caller lacks the necessary permissions.
  message AccessDenied {
    string reason = 1;
    reserved 100 to 199;
  }

  // A file in the push violates the configured license policy.
  message LicenseViolation {
    string path = 1;
    string license = 2;
    reserved 100 to 199;
  }

  // Required CI checks did not pass.
  message CiChecksFailed {
    repeated string checks = 1;
    reserved 100 to 199;
  }

  // Branch protection requires more reviewers than the push has.
  message ReviewRequired {
    uint32 required = 1;
    uint32 current = 2;
    reserved 100 to 199;
  }

  // Tenant quota exceeded.
  message QuotaExceeded {
    string limit = 1;
    reserved 100 to 199;
  }

  reserved 100 to 199;
}

// ============================================================
// Pull protocol
// ============================================================

// Request to pull updates from the server.
message PullRequest {
  TenantId tenant_id = 1;
  TreeId tree_id = 2;
  BranchId branch_id = 3;
  optional SnapshotId current_tip = 4;
  AccountId account_id = 5;
  optional uint32 depth = 6;

  reserved 100 to 199;
}

// Server response with updates.
message PullResponse {
  bool has_updates = 1;
  optional SnapshotId new_tip = 2;
  repeated SnapshotId snapshot_chain = 3;
  repeated ContentHash objects_to_fetch = 4;
  // Full records for every snapshot in `snapshot_chain` (oldest first).
  repeated SnapshotRecord snapshots = 5;
  // v0.5: paths whose content the caller may not read (license rules); their
  // blobs are not in objects_to_fetch and DownloadObjects refuses them.
  repeated string stubbed_paths = 6;

  reserved 100 to 199;
}

// ============================================================
// Staged snapshot upload
// ============================================================

// Upload a staged snapshot to the server.
message StageUploadRequest {
  TenantId tenant_id = 1;
  TreeId tree_id = 2;
  BranchId branch_id = 3;
  string branch_name = 4;
  SnapshotId snapshot_id = 5;
  repeated string files_changed = 6;
  uint32 files_added = 7;
  uint32 files_modified = 8;
  uint32 files_deleted = 9;
  optional string message = 10;
  AccountId account_id = 11;
  // v0.5: manifest of the staged working state (already uploaded). The
  // server keeps its objects alive (GC root) and lets readers fetch them.
  optional ContentHash manifest_hash = 12;
  // v0.8 (§16.8): named slot; one staged entry per (account, branch, label).
  string label = 13;

  reserved 100 to 199;
}

// Server acknowledgment.
message StageUploadResponse {
  bool accepted = 1;
  optional string error = 2;

  reserved 100 to 199;
}

// ============================================================
// Access config sync
// ============================================================

// Kind of access config being synced.
enum AccessConfigType {
  ACCESS_CONFIG_TYPE_UNSPECIFIED = 0;
  ACCESS_CONFIG_TYPE_ROLES = 1;
  ACCESS_CONFIG_TYPE_POLICIES = 2;
  ACCESS_CONFIG_TYPE_TENANT_ACCESS = 3;
  ACCESS_CONFIG_TYPE_BRANCH_PROTECTION = 4;
  ACCESS_CONFIG_TYPE_LICENSE = 5;
}

// Sync access configuration changes.
message AccessConfigSyncRequest {
  TenantId tenant_id = 1;
  AccessConfigType config_type = 2;
  bytes content = 3;
  ContentHash config_hash = 4;
  AccountId account_id = 5;
  // v0.5: tree-level documents (from <tree>/.wt-tree/access/) may only
  // restrict access (deny statements).
  optional TreeId tree_id = 6;
  // v0.5: validate and report the changes without applying them.
  bool dry_run = 7;

  reserved 100 to 199;
}

// Server validation response.
message AccessConfigSyncResponse {
  bool accepted = 1;
  repeated string validation_errors = 2;
  // v0.5: human-readable plan, e.g. "policy protect-main: update (2 statements)".
  repeated string changes = 3;

  reserved 100 to 199;
}

// ============================================================
// Sync state (local tracking)
// ============================================================

// Tracks the sync state between client and server.
// Not transmitted on the wire today — kept here for parity with Rust
// domain types, may move to a local-state .proto if it grows.
message SyncState {
  optional google.protobuf.Timestamp last_sync = 1;
  optional SnapshotId local_tip = 2;
  optional SnapshotId remote_tip = 3;
  uint32 pending_staged = 4;
  uint32 pending_objects = 5;
  bool is_syncing = 6;
  bool offline = 7;

  reserved 100 to 199;
}

// ============================================================
// Sync envelope (wire framing — kept for parity)
// ============================================================

// Envelope for sync messages. gRPC supersedes this for the bg<->server
// transport; this type is kept for parity with the Rust domain layer
// during the WT-PROTO migration. Once all callers move to direct gRPC
// calls, the envelope (and crates/worktree-protocol/src/feature/wire/)
// can be deleted.
message SyncEnvelope {
  SyncMessageType message_type = 1;
  bytes payload = 2;
  google.protobuf.Timestamp timestamp = 3;
  uint64 sequence = 4;

  reserved 100 to 199;
}

// ============================================================
// SyncService — the bg<->server gRPC service
// ============================================================

service SyncService {
  // Upload a staged snapshot for team visibility.
  rpc Stage(StageUploadRequest) returns (StageUploadResponse);

  // Push a branch tip with conflict detection.
  rpc Push(PushRequest) returns (PushResponse);

  // Pull updates from the server (delta sync).
  rpc Pull(PullRequest) returns (PullResponse);

  // Negotiate which objects to transfer (have/want delta).
  rpc Negotiate(NegotiateRequest) returns (ObjectTransferPlan);

  // Sync access config changes (roles, policies, branch protection, ...).
  rpc SyncAccessConfig(AccessConfigSyncRequest) returns (AccessConfigSyncResponse);

  // Upload content-addressed objects (manifests, blobs). Server verifies
  // BLAKE3(data) == hash for every object and dedups.
  rpc UploadObjects(stream ObjectData) returns (UploadObjectsResponse);

  // Download the requested objects. Unknown hashes are skipped.
  rpc DownloadObjects(WantMessage) returns (stream ObjectData);

  // Resolve a tree by tenant slug + name, optionally creating it.
  rpc ResolveTree(ResolveTreeRequest) returns (TreeInfo);

  // List branches (and their tips) of a tree.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);

  // List staged (WIP) snapshots visible to the caller.
  rpc ListStaged(ListStagedRequest) returns (ListStagedResponse);

  // Push / list tags of a tree.
  rpc PushTag(PushTagRequest) returns (PushTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // Liveness + identity probe ("who am I").
  rpc Ping(PingRequest) returns (PingResponse);

  // ---- v0.5 (docs/ENGINEERING_PLAN.md §13) ----

  // Stream branch updates of the given trees until the client disconnects
  // (the daemon uses it to fetch remote changes as they land).
  rpc WatchBranches(WatchBranchesRequest) returns (stream BranchEvent);

  // Discard the caller's staged (WIP) snapshot on a branch.
  rpc Unstage(UnstageRequest) returns (UnstageResponse);

  // Read back the last applied declarative access document.
  rpc GetAccessConfig(GetAccessConfigRequest) returns (GetAccessConfigResponse);

  // ---- v0.8 (docs/ENGINEERING_PLAN.md §16) ----

  // Upload objects as a pack stream (deltas allowed, resumable by
  // upload_id/offset; §16.1).
  rpc UploadPack(stream PackChunk) returns (UploadPackResponse);
  // How many bytes of an interrupted pack upload the server kept.
  rpc QueryUpload(QueryUploadRequest) returns (QueryUploadResponse);
  // Download objects as a pack stream (deltas against objects the client
  // says it has; §16.1).
  rpc DownloadPack(DownloadPackRequest) returns (stream PackChunk);
  // Delete a tag (respecting tag protections; §16.10).
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
}

// ---- v0.8 messages ----

// A slice of a pack stream (format in specs/sync/PackFormat.md).
message PackChunk {
  bytes data = 1;
  // Uploads: the id that names this upload (first chunk), and the byte
  // offset of data within the whole pack (resume).
  string upload_id = 2;
  uint64 offset = 3;
  TreeId tree_id = 4;

  reserved 100 to 199;
}

message UploadPackResponse {
  uint32 objects_stored = 1;
  uint32 objects_already_present = 2;
  repeated ContentHash rejected = 3;
  uint64 bytes_received = 4;

  reserved 100 to 199;
}

message QueryUploadRequest {
  string upload_id = 1;

  reserved 100 to 199;
}

message QueryUploadResponse {
  bool found = 1;
  uint64 offset = 2;

  reserved 100 to 199;
}

message DownloadPackRequest {
  TreeId tree_id = 1;
  repeated ContentHash want = 2;
  // Objects the client already has (delta bases).
  repeated ContentHash have = 3;
  bool allow_deltas = 4;

  reserved 100 to 199;
}

message DeleteTagRequest {
  TreeId tree_id = 1;
  string name = 2;

  reserved 100 to 199;
}

message DeleteTagResponse {
  bool deleted = 1;
  optional string error = 2;

  reserved 100 to 199;
}

// ============================================================
// Content-addressed objects (WT-PROTO-3)
//
// Object hash = BLAKE3 of the exact `data` bytes (32 bytes).
//   - BLOB:       raw file content (or one chunk of a large file)
//   - MANIFEST:   protobuf-encoded ManifestRecord
//   - CHUNK_LIST: protobuf-encoded ChunkList (a large file split by FastCDC)
// Snapshots are NOT stored as objects; they travel as SnapshotRecord.
// ============================================================

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_BLOB = 1;
  OBJECT_KIND_MANIFEST = 2;
  OBJECT_KIND_CHUNK_LIST = 3;
}

// A large file stored as content-defined chunks (each chunk is a BLOB).
// The file content is the concatenation of the chunks in order.
message ChunkList {
  uint64 size = 1;           // total file size in bytes
  repeated Chunk chunks = 2;

  reserved 100 to 199;
}

message Chunk {
  ContentHash hash = 1;      // BLAKE3 of the chunk bytes (a BLOB object)
  uint64 size = 2;

  reserved 100 to 199;
}

message ObjectData {
  ContentHash hash = 1;
  ObjectKind kind = 2;
  bytes data = 3;

  reserved 100 to 199;
}

message UploadObjectsResponse {
  uint32 received = 1;
  uint32 stored = 2;     // newly stored (not already present)
  repeated ContentHash rejected = 3; // hash mismatch

  reserved 100 to 199;
}

// One file in a manifest. Paths are '/'-separated, relative to the tree root,
// sorted lexicographically, unique.
message ManifestEntry {
  string path = 1;
  ContentHash blob_hash = 2;
  uint64 size = 3;
  bool executable = 4;
  // When true, blob_hash names a CHUNK_LIST object instead of a BLOB.
  bool chunked = 5;

  reserved 100 to 199;
}

message ManifestRecord {
  repeated ManifestEntry entries = 1;

  reserved 100 to 199;
}

message SnapshotRecord {
  SnapshotId id = 1;
  TreeId tree_id = 2;
  string branch_name = 3;
  repeated SnapshotId parents = 4;
  ContentHash manifest_hash = 5;
  string author = 6;          // account username or "name <email>"
  string message = 7;
  google.protobuf.Timestamp created_at = 8;
  bool auto_generated = 9;
  // v0.5: declared dependencies on other trees/branches (become TODOs).
  repeated Dependency dependencies = 10;
  // v0.5: set on revert snapshots (the snapshot whose changes are undone).
  optional SnapshotId reverts = 11;
  // v0.5: Ed25519 signature over SignedSnapshotPayload (see §13.6) and the
  // id of the account signing key that produced it. Empty = unsigned.
  bytes signature = 12;
  string signing_key_id = 13;

  reserved 100 to 199;
}

// A dependency declared on a snapshot. The target is a tree of the same
// tenant (tenant_slug empty) or of another tenant, optionally a branch.
message Dependency {
  string tenant_slug = 1;
  string tree = 2;
  string branch = 3;      // "" = the tree's default branch
  string title = 4;
  string details = 5;
  string priority = 6;    // "low" | "medium" | "high" | "critical"
  bool blocking = 7;      // the dependent branch may not merge until done
  bool linked = 8;        // the branches must merge together (linked group)

  reserved 100 to 199;
}

// Canonical bytes that a snapshot signature covers: the SnapshotRecord with
// signature and signing_key_id cleared, protobuf-encoded deterministically.
message SignedSnapshotPayload {
  SnapshotRecord record = 1;

  reserved 100 to 199;
}

message WatchBranchesRequest {
  repeated TreeId tree_ids = 1;

  reserved 100 to 199;
}

message BranchEvent {
  TreeId tree_id = 1;
  string branch_name = 2;
  optional SnapshotId old_tip = 3;
  optional SnapshotId new_tip = 4;   // unset when the branch was deleted
  string actor = 5;
  google.protobuf.Timestamp at = 6;

  reserved 100 to 199;
}

message UnstageRequest {
  TreeId tree_id = 1;
  string branch_name = 2;

  reserved 100 to 199;
}

message UnstageResponse {
  bool removed = 1;

  reserved 100 to 199;
}

message GetAccessConfigRequest {
  TenantId tenant_id = 1;
  optional TreeId tree_id = 2;
  AccessConfigType config_type = 3;

  reserved 100 to 199;
}

message GetAccessConfigResponse {
  bool found = 1;
  bytes content = 2;
  ContentHash config_hash = 3;
  google.protobuf.Timestamp updated_at = 4;
  string updated_by = 5;

  reserved 100 to 199;
}

message ResolveTreeRequest {
  string tenant_slug = 1;
  string tree_name = 2;
  bool create_if_missing = 3;

  reserved 100 to 199;
}

message TreeInfo {
  TreeId tree_id = 1;
  TenantId tenant_id = 2;
  string tenant_slug = 3;
  string name = 4;
  string default_branch = 5;
  bool created = 6;

  reserved 100 to 199;
}

message ListBranchesRequest {
  TreeId tree_id = 1;

  reserved 100 to 199;
}

message BranchInfo {
  string name = 1;
  optional SnapshotId tip = 2;
  bool protected = 3;
  google.protobuf.Timestamp updated_at = 4;

  reserved 100 to 199;
}

message ListBranchesResponse {
  repeated BranchInfo branches = 1;

  reserved 100 to 199;
}

message ListStagedRequest {
  TreeId tree_id = 1;
  optional string branch_name = 2;

  reserved 100 to 199;
}

message StagedInfo {
  SnapshotId snapshot_id = 1;
  string author = 2;
  string branch_name = 3;
  repeated string files_changed = 4;
  uint32 files_added = 5;
  uint32 files_modified = 6;
  uint32 files_deleted = 7;
  optional string message = 8;
  google.protobuf.Timestamp staged_at = 9;
  // v0.5: manifest of the staged state when the client sent one.
  optional ContentHash manifest_hash = 10;
  // v0.8 (§16.8).
  string label = 11;

  reserved 100 to 199;
}

message ListStagedResponse {
  repeated StagedInfo staged = 1;

  reserved 100 to 199;
}

message TagRecord {
  string name = 1;
  SnapshotId target = 2;
  optional string message = 3;
  string tagger = 4;
  google.protobuf.Timestamp created_at = 5;
  // v0.7 (§15.8): Ed25519 signature over the TagRecord with signature and
  // signing_key_id cleared, and the signing key id. Empty = unsigned.
  bytes signature = 6;
  string signing_key_id = 7;

  reserved 100 to 199;
}

message PushTagRequest {
  TreeId tree_id = 1;
  TagRecord tag = 2;

  reserved 100 to 199;
}

message PushTagResponse {
  bool accepted = 1;
  optional string error = 2;

  reserved 100 to 199;
}

message ListTagsRequest {
  TreeId tree_id = 1;

  reserved 100 to 199;
}

message ListTagsResponse {
  repeated TagRecord tags = 1;

  reserved 100 to 199;
}

message PingRequest {
  reserved 100 to 199;
}

message PingResponse {
  string server_version = 1;
  optional AccountId account_id = 2;  // set when the bearer token is valid
  optional string username = 3;
  optional string tenant_slug = 4;

  reserved 100 to 199;
}
