[package]
name = "worktree-git"
version = "0.7.0"
edition = "2021"
description = "Git compatibility layer for Worktree: import, export, and remote bridge"

[dependencies]
worktree-protocol = { path = "../worktree-protocol" }
worktree-sdk = { path = "../worktree-sdk" }
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tempfile = "3"
