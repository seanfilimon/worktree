        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listGroups
      summary: List linked merge groups
      description: Linked groups of the tenant, newest first. Members of trees the caller cannot read show only `tree_id` and `mr_number`.
      tags: [MergeRequests]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Linked groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createGroup
      summary: Link merge requests
      description: |
        Creates a linked group of 2-50 open merge requests (`tree` =
        `tenant/tree`) that merge atomically. The caller needs `tenant:read`
        on the group's tenant, `tree:read` (unreadable trees answer 404) and
        `mr:merge` on every member tree. Members get `linked_group` set.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'tree:read', 'mr:merge']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a member merge request is not open or already belongs to an open linked group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Linked group id.
        schema:
          type: string
    get:
      operationId: getGroup
      summary: Get a linked group
      tags: [MergeRequests]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The linked group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: closeGroup
      summary: Close a linked group
      description: Closes the group (kept for history) and unlinks its members. Its creator may close it; anyone else needs `mr:merge` on every member tree.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'mr:merge']
      responses:
        "200":
          description: The closed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Linked group id.
        schema:
          type: string
    post:
      operationId: mergeGroup
      summary: Merge a linked group
      description: |
        Merges every member atomically: all members must be mergeable; the
        target tips move with compare-and-swap in order and are rolled back
        on failure. Requires `mr:merge` on every member tree. Publishes
        `group.merged`.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'mr:merge']
      responses:
        "200":
          description: The merged group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`merge_blocked`: a member is not mergeable (message names the blocker); `conflict`: the group is not open or a target moved."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/tag-protections:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listTagProtections
      summary: List tag protections
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Tag protection rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagProtection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putTagProtection
      summary: Create or replace a tag protection
      description: Upserts the rule for `pattern` (a path.Match glob). `no_delete` forbids deleting matching tags, `no_move` replacing them; `allowed_taggers` (usernames) restricts who may create them (empty = anyone with `tree:write`). Audited as `tag_protection.update`.
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagProtection"
      responses:
        "200":
          description: The stored rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagProtection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteTagProtection
      summary: Delete a tag protection
      description: Audited as `tag_protection.delete`.
      tags: [Trees]
      x-wt-action: tree:admin
      parameters:
        - name: pattern
          in: query
          required: true
          description: Pattern of the rule to delete.
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenantAccessConfig
      summary: Get the tenant access document
      description: The last applied declarative access document of the tenant (`content` is the canonical JSON, base64-encoded).
      tags: [Access]
      x-wt-action: iam:read
      responses:
        "200":
          description: The last applied document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigDoc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: the tenant does not exist or no access document has been applied to it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config/plan:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: planTenantAccessConfig
      summary: Plan a tenant access document
      description: |
        Dry run: validates the canonical JSON document (`{"roles":[...],
        "policies":[...]}`; a JSON string holding it is accepted too),
        checks for privilege escalation and returns the changes it would
        make to config-managed roles and policies. Validation failures
        answer 200 with `accepted: false` and `errors`.
      tags: [Access]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config/apply:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: applyTenantAccessConfig
      summary: Apply a tenant access document
      description: |
        Like plan, then atomically replaces the config-managed roles and
        policies (`managed_by: config`) and stores the document. Audited as
        `access.applied`; publishes `access.applied`. Rejected documents
        answer 200 with `accepted: false` and change nothing.
      tags: [Access]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The applied plan (or the rejection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/access-config:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: getTreeAccessConfig
      summary: Get the tree access document
      description: The last applied tree-level access document (deny statements only).
      tags: [Access]
      x-wt-action: tree:read
      responses:
        "200":
          description: The last applied document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigDoc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: the tree does not exist or no access document has been applied to it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/access-config/plan:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    post:
      operationId: planTreeAccessConfig
      summary: Plan a tree access document
      description: Dry run of a tree-level document (policies with deny statements only; allow statements and roles are rejected). Validation failures answer 200 with `accepted false`.
      tags: [Access]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/access-config/apply:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    post:
      operationId: applyTreeAccessConfig
      summary: Apply a tree access document
      description: Applies a tree-level document and stores it. Audited as `access.applied`; publishes `access.applied`.
      tags: [Access]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The applied plan (or the rejection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    patch:
      operationId: adminPatchTenant
      summary: Set a tenant's status
      description: |
        Sets `status` (`active`, `suspended`, `deactivated`) and/or
        `status_reason`. Suspended tenants are read-only and deactivated
        ones refuse all access (server admins excepted); nothing is revoked,
        so resuming restores everything. Setting `active` without a reason
        clears the reason. Audited as `tenant.status`.
      tags: [Admin, Tenants]
      x-wt-action: server:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantStatusRequest"
      responses:
        "200":
          description: The updated tenant (`status` "" means active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token (`/auth/login`), personal API token (`/auth/tokens`) or service-account key.
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: The bearer token as a query parameter; accepted on GET requests only (for `EventSource`).
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: Tenant slug (or tenant id).
      schema:
        type: string
    Tree:
      name: tree
      in: path
      required: true
      description: Tree name within the tenant.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items (positive integer; larger values are clamped).
      schema:
        type: integer
        minimum: 1
  headers:
    RetryAfter:
      description: Seconds until the rate limit allows another request.
      schema:
        type: integer
  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: "`bad_request`: invalid parameters or body (also `415 unsupported_media_type`, `413 payload_too_large` for oversized bodies)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthenticated`: authentication required or the token is invalid."
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden` (or a feature-specific code): the caller may not perform the action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: the resource does not exist or is not visible to the caller."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "`conflict` (or a feature-specific code): the request conflicts with the current state."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "`payload_too_large`: the request body exceeds the limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: the request body must be application/json."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnavailableForLegalReasons:
      description: "`license_restricted`: a license rule forbids reading this content."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "`rate_limited`: the per-principal rate limit was exceeded."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: "`internal`: unexpected server error (details are logged, not returned)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: "`not_implemented`: the feature's service is not configured on this server."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    APIToken:
      type: object
      required: [id, account_id, name, created_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        kind:
          type: string
          description: "v0.4 IAM (§12). Empty Kind is treated as TokenSession when Name is \"session\", else TokenAPI (tokens created before v0.4)."
        service_account_id:
          type: string
          description: "TokenService only (AccountID empty)"
        scopes:
          type: array
          items:
            type: string
        mfa:
          type: boolean
          description: "session created after a second factor"
        last_ip:
          type: string
        user_agent:
          type: string
    AccessConfigDoc:
      type: object
      description: "AccessConfigDoc is the last applied declarative access document of a tenant (TreeID \"\") or tree."
      required: [tenant_id, kind, content, hash, updated_by, updated_at]
      properties:
        tenant_id:
          type: string
        tree_id:
          type: string
        kind:
          type: string
          description: "\"roles\" | \"policies\" | \"license\" | \"combined\""
        content:
          type: [string, "null"]
          contentEncoding: base64
        hash:
          type: string
          description: "hex BLAKE3 of Content"
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    AccessConfigRequest:
      type: object
      description: "accessConfigRequest is the body of plan / apply. Content is the canonical JSON object; a JSON string holding the document is accepted too."
      properties:
        content:
          description: "Any JSON value."
    AccessConfigResult:
      type: object
      description: "Result of an access-config plan or apply (accesscfg.Result). When accepted is false, errors explains why and nothing was changed."
      required: [accepted, errors, changes]
      properties:
        accepted:
          type: boolean
        errors:
          type: [array, "null"]
          items:
            type: string
        changes:
          type: [array, "null"]
          items:
            type: string
          description: "Human-readable plan lines (\"create role ...\", \"update policy ...\", \"delete ...\")."
    Account:
      type: object
      required: [id, username, email, display_name, tenant_id, is_admin, disabled, created_at]
      properties:
        id:
          type: string
        username:
          type: string
          description: "unique, also the slug of the personal tenant"
        email:
          type: string
        display_name:
          type: string
        tenant_id:
          type: string
          description: "personal tenant"
        is_admin:
          type: boolean
          description: "server-wide admin"
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    ActionInfo:
      type: object
      description: "ActionInfo describes one authorization action (GET /api/v1/iam/actions)."
      required: [action, description, area]
      properties:
        action:
          type: string
        description:
          type: string
        area:
          type: string
          description: "the part before ':', e.g. \"tree\""
    ActivityDay:
      type: object
      required: [date, snapshots]
      properties:
        date:
          type: string
        snapshots:
          type: integer
    Approval:
      type: object
      required: [account_id, username, at]
      properties:
        account_id:
          type: string
        username:
          type: string
        at:
          type: string
          format: date-time
        snapshot_id:
          type: string
          description: "v0.5 (§13). An approval counts only while SnapshotID equals the current source tip (\"\" = recorded before v0.5: counts). Decision \"\" = ReviewApproved."
        decision:
          type: string
        body:
          type: string
    ApprovalSummary:
      type: object
      description: "ApprovalSummary counts the approvals of a merge request (review.ApprovalSummary)."
      required: [required, current, stale, changes_requested]
      properties:
        required:
          type: integer
        current:
          type: integer
          description: "approvals of the current source tip"
        stale:
          type: integer
          description: "approvals of an older source tip"
        changes_requested:
          type: [array, "null"]
          items:
            type: string
          description: "ChangesRequested lists the reviewers whose change request is open."
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_id, actor, action, resource_type, resource_id, at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          description: "username, \"anonymous\" or \"system\""
        action:
          type: string
          description: "e.g. \"branch.push\", \"tree.create\", \"auth.login\""
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        remote_addr:
          type: string
        at:
          type: string
          format: date-time
    AuthProviders:
      type: object
      required: [password, registration, sso]
      properties:
        password:
          type: boolean
        registration:
          type: boolean
        sso:
          $ref: "#/components/schemas/SSOProviderInfo"
    BlameLine:
      type: object
      description: "BlameLine attributes one line of a file to the snapshot that last changed it."
      required: [line, text, snapshot_id, author, message, at]
      properties:
        line:
          type: integer
          description: "1-based"
        text:
          type: string
        snapshot_id:
          type: string
        author:
          type: string
        message:
          type: string
          description: "first line"
        at:
          type: string
          format: date-time
    BlameResponse:
      type: object
      description: "blameResponse is the body of GET {tree}/blame/{rev}/{path...}."
      required: [lines, snapshot]
      properties:
        lines:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/BlameLine"
          description: "The file's lines (or the requested range), in order."
        snapshot:
          $ref: "#/components/schemas/Snapshot"
          description: "the snapshot REV resolved to"
    Branch:
      type: object
      required: [tree_id, name, tip, protected, created_at, updated_at]
      properties:
        tree_id:
          type: string
        name:
          type: string
        tip:
          type: string
          description: "snapshot id; \"\" for an empty branch"
        protected:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BranchProtection:
      type: object
      description: "BranchProtection applies to every branch whose name matches Pattern (path.Match glob, e.g. \"main\" or \"release/*\")."
      required: [tree_id, pattern, no_direct_push, required_approvals, allowed_pushers, no_delete]
      properties:
        tree_id:
          type: string
        pattern:
          type: string
        no_direct_push:
          type: boolean
          description: "changes only via merge requests"
        required_approvals:
          type: integer
          description: "for MR merge"
        allowed_pushers:
          type: [array, "null"]
          items:
            type: string
          description: "usernames; empty = role-based only"
        no_delete:
          type: boolean
        require_ci_pass:
          type: boolean
          description: "v0.5 (§13). every RequiredChecks context must be success on the source tip"
        required_checks:
          type: array
          items:
            type: string
          description: "CI contexts; empty with RequireCIPass = all reported checks"
        require_signed:
          type: boolean
          description: "pushed snapshots must carry a verified signature"
        require_linear:
          type: boolean
          description: "no merge snapshots"
        block_on_todos:
          type: boolean
          description: "open blocking TODOs of the source branch block merging"
        merge_methods:
          type: array
          items:
            type: string
            enum: [fast-forward, merge, squash]
          description: "v0.6 (§14.1): merge methods allowed into matching branches (empty = all). The lists of all matching rules intersect. `require_linear` also forbids `merge`, `require_signed` forbids `merge` and `squash`. Unknown names answer 400; the stored list is deduplicated in preference order (fast-forward, merge, squash)."
    CICombinedStatus:
      type: object
      description: "Combined CI view of one snapshot (ci.Status). state is failure if any check failed or errored, else pending if any is pending, else success; \"\" when no check was reported."
      required: [snapshot, state, checks]
      properties:
        snapshot:
          type: string
        state:
          type: string
          enum: ["", pending, success, failure, error]
        checks:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CIStatus"
    CIReport:
      type: object
      description: "Body of POST {tree}/ci/status (ci.Report). snapshot is a revision of the tree (id, branch, tag or unique id prefix) and is resolved to a snapshot id."
      required: [snapshot, context, state]
      properties:
        snapshot:
          type: string
        context:
          type: string
          description: "Name of the check (e.g. \"ci/build\")."
        state:
          type: string
          enum: [pending, success, failure, error]
        description:
          type: string
        target_url:
          type: string
    CIStatus:
      type: object
      description: "CIStatus is one check result for a snapshot (keyed by tree, snapshot, context; a newer report replaces the older one)."
      required: [tree_id, snapshot_id, context, state, reporter, updated_at]
      properties:
        tree_id:
          type: string
        snapshot_id:
          type: string
        context:
          type: string
          description: "check name, e.g. \"ci/build\""
        state:
          type: string
        description:
          type: string
        target_url:
          type: string
        reporter:
          type: string
          description: "username or \"sa:<tenant>/<name>\""
        updated_at:
          type: string
          format: date-time
    CISummary:
      type: object
      description: "CISummary is the CI state of the source tip (review.CISummary)."
      required: [state, required, missing]
      properties:
        state:
          type: string
          description: "combined state of every reported check (\"\" = none)"
        required:
          type: [array, "null"]
          items:
            type: string
          description: "required contexts (RequireCIPass)"
        missing:
          type: [array, "null"]
          items:
            type: string
          description: "required contexts without a report"
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
    CodeSearchHit:
      type: object
      description: "CodeSearchHit is one matching line of a code search."
      required: [tenant, tree, branch, snapshot_id, path, line, text]
      properties:
        tenant:
          type: string
        tree:
          type: string
        branch:
          type: string
        snapshot_id:
          type: string
        path:
          type: string
        line:
          type: integer
          description: "1-based"
        text:
          type: string
        before:
          type: array
          items:
            type: string
          description: "context lines"
        after:
          type: array
          items:
            type: string
    CodeSearchResult:
      type: object
      description: "Result is the answer to a code search (codesearch.Result). Hits are ordered by tenant, tree, path and line."
