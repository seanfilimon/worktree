    Policy:
      type: object
      description: "Policy is a named, versioned set of statements scoped to one tenant. Evaluation: an explicit deny in any enabled policy overrides every allow (roles, grants and policy allows). Policy allows extend role grants."
      required: [id, tenant_id, name, description, enabled, statements, version, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        statements:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyStatement"
        version:
          type: integer
          description: "incremented on every update"
        managed_by:
          type: string
          description: "ManagedBy is ManagedByConfig for policies applied from a declarative access document (\"\" = managed through the REST API)."
        tree_id:
          type: string
          description: "TreeID is set for config-managed policies that come from a tree-level access document (<tree>/.wt-tree/access/policies.toml): deny-only statements whose resources all lie inside that tree."
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyConditions:
      type: object
      description: "PolicyConditions restrict when a statement applies. All set fields must hold (logical AND); an empty struct always holds."
      properties:
        ip_ranges:
          type: array
          items:
            type: string
          description: "CIDRs; request IP must be in one"
        require_mfa:
          type: boolean
          description: "principal's session used MFA"
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        time_window:
          $ref: "#/components/schemas/TimeWindow"
    PolicyDiff:
      type: object
      description: "DiffResult answers GET .../policies/{id}/diff (policyhist.DiffResult)."
      required: [from, to, changes, fields]
      properties:
        from:
          type: integer
          description: "version; 0 = the empty policy"
        to:
          type: integer
        changes:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyStatementChange"
          description: "Changes lists the added and changed statements in the order of the `to` version, followed by the removed ones in the order of `from`."
        fields:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyFieldChange"
    PolicyFieldChange:
      type: object
      description: "FieldChange is a difference in a policy-level field (name, description, enabled)."
      required: [field, before, after]
      properties:
        field:
          type: string
          enum: [name, description, enabled]
        before:
          description: "Any JSON value (null when the `from` side is the empty policy)."
        after:
          description: "Any JSON value (null when the `to` side is the empty policy)."
    PolicyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: [boolean, "null"]
          description: "default true"
        statements:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyStatement"
        version:
          type: integer
          description: "Version, when non-zero on PUT, must equal the stored version (optimistic concurrency)."
        id:
          type: string
          description: "Server-managed fields: accepted so that a fetched policy can be sent back unchanged, and ignored."
        tenant_id:
          type: string
        created_by:
          type: string
        created_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        managed_by:
          type: string
          description: "v0.5; changed only by access documents"
        tree_id:
          type: string
          description: "v0.5; changed only by access documents"
    PolicyStatement:
      type: object
      description: "PolicyStatement grants or denies actions on resources to principals. Resources: \"wt:tenant/<slug>\", \"wt:tree/<tenant>/<tree>\", \"wt:branch/<tenant>/<tree>/<branch>\", \"wt:path/<tenant>/<tree>/<path>\" with \"*\" (one segment) and \"**\" (any depth) wildcards, or \"*\" for all. Principals: \"user:<username>\", \"team:<slug>\", \"role:<role>\", \"sa:<service-account>\", \"tenant:<slug>\" (every member and service account of that tenant), \"authenticated\", \"anonymous\", \"*\". Actions: concrete Action strings, \"<area>:*\" or \"*\"."
      required: [effect, actions, resources, principals, conditions]
      properties:
        sid:
          type: string
        effect:
          type: string
          description: "EffectAllow | EffectDeny"
        actions:
          type: [array, "null"]
          items:
            type: string
        resources:
          type: [array, "null"]
          items:
            type: string
        principals:
          type: [array, "null"]
          items:
            type: string
        conditions:
          $ref: "#/components/schemas/PolicyConditions"
    PolicyStatementChange:
      type: object
      description: "StatementChange is one statement-level difference between two versions. Statements are matched by sid; a sid that occurs more than once is matched occurrence by occurrence. Statements without a sid are matched by position among the statements without a sid: the n-th one of `from` is compared with the n-th one of `to`."
      required: [op, sid, index]
      properties:
        op:
          type: string
          enum: [add, remove, change]
        sid:
          type: string
          description: "\"\" for statements without a sid"
        index:
          type: integer
          description: "Index is the statement's position in the `to` version (add, change) or in the `from` version (remove)."
        statement:
          $ref: "#/components/schemas/PolicyStatement"
          description: "Statement is the added or removed statement."
        before:
          $ref: "#/components/schemas/PolicyStatement"
          description: "Before and After are the two sides of a changed statement."
        after:
          $ref: "#/components/schemas/PolicyStatement"
    PolicyVersion:
      type: object
      description: "PolicyVersion is a stored revision of a policy (every create, update, delete and rollback appends one)."
      required: [tenant_id, policy_id, version, change, policy, changed_by, changed_at]
      properties:
        tenant_id:
          type: string
        policy_id:
          type: string
        version:
          type: integer
        change:
          type: string
          description: "\"create\" | \"update\" | \"delete\" | \"rollback\""
        policy:
          $ref: "#/components/schemas/Policy"
          description: "the policy after the change (deletes: before)"
        changed_by:
          type: string
        changed_at:
          type: string
          format: date-time
        comment:
          type: string
