      required: [hits, truncated, searched_trees]
      properties:
        hits:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CodeSearchHit"
        truncated:
          type: boolean
          description: "More than `limit` hits exist, or the 5 s time budget ran out; the hits found so far are returned."
        searched_trees:
          type: integer
          description: "Number of trees searched (trees whose index could not be built are skipped)."
    CompareResult:
      type: object
