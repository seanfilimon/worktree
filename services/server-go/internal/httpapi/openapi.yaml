      required: [id, tenant_id, url, events, active, has_secret, created_by, created_at, updated_at, failure_count]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tree_id:
          type: string
        url:
          type: string
        description:
          type: string
        events:
          type: [array, "null"]
          items:
            type: string
          description: "Events are event-type patterns (\"branch.pushed\", \"mr.*\", \"*\")."
        active:
          type: boolean
        has_secret:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_delivery_at:
          type: string
          format: date-time
        last_status:
          type: integer
          description: "HTTP status of the last attempt (0 = network error)"
        failure_count:
          type: integer
          description: "consecutive failed deliveries"
    WebhookDelivery:
      type: object
      description: "WebhookDelivery is one delivery (with its retries) of an event."
