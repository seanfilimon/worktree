        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        description: Comment id.
        schema:
          type: string
    patch:
      operationId: updateComment
      summary: Edit or resolve a comment
      description: Changes `body` and/or `resolved`. Only the comment's author or a caller with `tree:admin` may change it.
      tags: [MergeRequests]
      x-wt-action: ['tree:read', 'tree:admin']
      requestBody:
        required: true
        content:
          application/json:
