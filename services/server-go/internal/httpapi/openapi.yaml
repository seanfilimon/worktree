      required: [kind, message]
      properties:
        kind:
          type: string
          description: "state | source | linked_group | approvals | changes_requested | ci | todos | linear | diverged | conflicts | merge_method | draft | owners. Since v0.6, linear, diverged, conflicts and merge_method are reported only when no allowed merge method can merge the request. v0.7: draft (the merge request is a draft) and owners (require_owner_approval: an owned changed path lacks an owner approval)."
        message:
          type: string
    MergeChecks:
      type: object
      description: "MergeChecks is the merge readiness of a merge request (review.MergeChecks)."
      required: [mergeable, blockers, approvals, ci, todos, methods, conflicts, owners]
      properties:
        mergeable:
          type: boolean
        blockers:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeBlocker"
        approvals:
          $ref: "#/components/schemas/ApprovalSummary"
        ci:
          $ref: "#/components/schemas/CISummary"
        todos:
          $ref: "#/components/schemas/TodoSummary"
        methods:
          type: [array, "null"]
          items:
            type: string
            enum: [fast-forward, merge, squash]
          description: "v0.6 (§14.1): the merge methods that are allowed and possible, in preference order (the first is the default)."
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
          description: "v0.6 (§14.1): the conflicts of the three-way merge when the branches diverged (empty otherwise)."
        owners:
          $ref: "#/components/schemas/OwnersSummary"
          description: "v0.7 (§15.7): owner approval of the changed paths."
    MergeConflict:
      type: object
      description: "Conflict is one path a server-side merge cannot resolve (review.Conflict). Tree is set for linked-group merges (\"tenant/tree\")."
      required: [path, kind]
      properties:
        tree:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [content, modify_delete, add_add, binary, chunked, executable, file_directory]
          description: "content: both sides changed overlapping lines of a text file; modify_delete: one side modified, the other deleted; add_add: both sides added the path with different content; binary / chunked: a binary or chunked (large) file changed on both sides; executable: same content added with different executable bits; file_directory: the merged tree would hold a file and a directory at one path."
    MergeConflictError:
      type: object
      description: "mergeConflictBody is the 409 merge_conflict response: the standard error envelope plus the conflicting paths, both at the top level and inside \"error\"."
      required: [error, conflicts]
      properties:
        error:
          $ref: "#/components/schemas/MergeConflictErrorDetail"
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
    MergeConflictErrorDetail:
      type: object
      description: "The `error` member of a merge_conflict response (`code` = `merge_conflict`)."
      required: [code, message, conflicts]
      properties:
        code:
          type: string
        message:
          type: string
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
