          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---- mirrors (§15.6) ----
  /api/v1/trees/{tenant}/{tree}/mirrors:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listTreeMirrors
      summary: List Git mirrors
      description: |
        v0.7 (§15.6). The Git push mirrors of the tree, oldest first, and
        whether this server can run them (`git`: the git binary must be on
        the server's PATH or given with `--git-binary`, version 2.31 or
        newer). Credentials are never returned (`has_credential` reports
        one).
      tags: [Trees]
      x-wt-action: tree:admin
      responses:
        "200":
          description: The mirrors and the git status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createTreeMirror
      summary: Add a Git mirror
      description: |
        v0.7 (§15.6). Mirrors the tree to a Git remote: after pushes, branch
        and tag changes and merges (debounced 5 s) and on demand, the server
        exports new snapshots into a local bare repository with `git
        fast-import` (deterministic commits: author and committer from the
        snapshot, its message, the manifest's files with chunked files
        reassembled and mode 100755 for executables, merge parents) and runs
        `git push --force-with-lease` for the mirrored branches (`branches`
        globs, empty = all) and, unless `tags` is false, the tags. Files
        whose license rule does not permit redistribution are left out and a
        `LICENSES/NOTICE` is added. `url` must be https://, http://, ssh://
        or scp-like; hosts on loopback, link-local or private addresses and
        file:// URLs are refused unless the server runs with
        `--mirror-allow-local`. `credential` (http(s) only; a token or
        `user:password`) reaches git as an HTTP header through the
        environment, never on a command line. At most 10 mirrors per tree.
        An active mirror is synced shortly after creation. Audited as
        `mirror.create`.
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMirrorRequest"
      responses:
        "201":
          description: The created mirror.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mirror"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the tree already mirrors to this URL or has the maximum number of mirrors (10)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/mirrors/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: id
        in: path
        required: true
        description: Mirror id.
        schema:
          type: string
    get:
      operationId: getTreeMirror
      summary: Get a Git mirror
      description: v0.7 (§15.6). The mirror with its last sync status and error.
      tags: [Trees]
      x-wt-action: tree:admin
      responses:
        "200":
          description: The mirror.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mirror"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: patchTreeMirror
      summary: Update a Git mirror
      description: |
        v0.7 (§15.6). Changes the fields present in the body (same rules as
        on create; `credential` "" removes the credential, `branches` []
        mirrors every branch). Changing `url` forgets what was pushed to the
        old remote. An active mirror is synced again shortly. Audited as
        `mirror.update` (with the changed fields).
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMirrorRequest"
      responses:
        "200":
          description: The updated mirror.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mirror"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteTreeMirror
      summary: Delete a Git mirror
      description: v0.7 (§15.6). Deletes the mirror, its export state and its local repository (cancelling a sync in progress). The remote is left as it is. Audited as `mirror.delete`.
      tags: [Trees]
      x-wt-action: tree:admin
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/mirrors/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: id
        in: path
        required: true
        description: Mirror id.
        schema:
          type: string
    post:
      operationId: syncTreeMirror
      summary: Sync a Git mirror now
      description: |
        v0.7 (§15.6). Exports the snapshots the mirror has not seen and
        pushes the mirrored refs now (waiting for a sync in progress). A
        failed export or push (for example a remote ref moved by someone
        else, which the lease refuses to overwrite) is reported in
        `result.error` and the mirror's `last_status`/`last_error`, not as
        an error status; `mirror.synced` or `mirror.failed` is published.
        With `wait=false` the sync runs in the background and the answer is
        202. Audited as `mirror.sync`.
      tags: [Trees]
      x-wt-action: tree:admin
      parameters:
        - name: wait
          in: query
          required: false
          description: "false = start the sync and answer 202 at once (default true)."
          schema:
            type: boolean
      responses:
        "200":
          description: The mirror after the sync and the sync result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorSync"
        "202":
          description: The sync was started (`result` is absent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorSync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the mirror is inactive, or mirrors are disabled because the git binary is missing or too old."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---- end mirrors ----
  # ---- notifications (§15.3) ----
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List your notifications
      description: |
        v0.7 (§15.3). The caller's notifications, newest first, and the
        number of unread ones. Notifications are created from server
        events: review requests (teams expanded), `@username` mentions in
        merge request descriptions, comments and reviews, CI failures on the
        source tip of an open merge request you authored or pushed, TODOs
        assigned to you, your merge requests being merged, approved,
        reviewed or commented on, and — for trees you watch — every merge
        request event, CI failure and published release. The actor is never
        notified, recipients need `tree:read` when the notification is
        created, duplicates within a minute are dropped, and each account
        keeps at most 1000 notifications for 90 days. Service accounts have
        no inbox (403).
      tags: [Notifications]
      x-wt-action: self
      parameters:
        - name: unread
          in: query
          required: false
          description: "`true` lists only unread notifications."
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of notifications (default 50, at most 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: The notifications and the unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: Mark every notification read
      description: v0.7 (§15.3). Marks every unread notification of the caller read.
      tags: [Notifications]
      x-wt-action: self
      responses:
        "200":
          description: How many notifications were marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadAllResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        description: Notification id.
        schema:
          type: string
    post:
      operationId: readNotification
      summary: Mark a notification read
      description: v0.7 (§15.3). Marks one of the caller's notifications read (idempotent).
      tags: [Notifications]
      x-wt-action: self
      responses:
        "200":
          description: The notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Notification id.
        schema:
          type: string
    delete:
      operationId: deleteNotification
      summary: Delete a notification
      description: v0.7 (§15.3). Removes one of the caller's notifications ("done").
      tags: [Notifications]
      x-wt-action: self
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notifications/settings:
    get:
      operationId: getNotificationSettings
      summary: Your notification settings
      description: |
        v0.7 (§15.3). `email` (default `true`) emails participating
        notifications when the server has SMTP configured
        (`email_configured`) and the account has an email address.
        Watching notifications are emailed per watch setting (`email`).
      tags: [Notifications]
      x-wt-action: self
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putNotificationSettings
      summary: Change your notification settings
      description: v0.7 (§15.3). Sets the given fields; omitted ones are unchanged.
      tags: [Notifications]
      x-wt-action: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsRequest"
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notifications/watches:
    get:
      operationId: listWatches
      summary: Your watch settings
      description: v0.7 (§15.3). Every tenant and tree watch setting the caller stored, with tenant slugs and tree names.
      tags: [Notifications]
      x-wt-action: self
      responses:
        "200":
          description: The watch settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/watch:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenantWatch
      summary: Your watch setting for a tenant
      description: |
        v0.7 (§15.3). The caller's watch level for every tree of the tenant
        (a tree's own setting overrides it). Without a stored setting the
        default is returned: `participating`, no email.
      tags: [Notifications]
      x-wt-action: tenant:read
      responses:
        "200":
          description: The watch setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putTenantWatch
      summary: Watch, participate in or ignore a tenant
      description: |
        v0.7 (§15.3). `level`: `participating` (only what involves you),
        `watching` (every merge request event, CI failure and release of
        every tree) or `ignoring` (nothing). `email` also emails watching
        notifications; omitted, it is unchanged.
      tags: [Notifications]
      x-wt-action: tenant:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The stored watch setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/watch:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: getTreeWatch
      summary: Your watch setting for a tree
      description: |
        v0.7 (§15.3). The caller's stored watch setting for the tree, or the
        default (`participating`, no email; the tenant's setting, if any,
        applies then).
      tags: [Notifications]
      x-wt-action: tree:read
      responses:
        "200":
          description: The watch setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putTreeWatch
      summary: Watch, participate in or ignore a tree
      description: |
        v0.7 (§15.3). `level`: `participating` (only what involves you),
        `watching` (every merge request event, CI failure and release) or
        `ignoring` (nothing from this tree). Overrides the tenant's setting.
        `email` also emails watching notifications; omitted, it is
        unchanged.
      tags: [Notifications]
      x-wt-action: tree:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchRequest"
      responses:
        "200":
          description: The stored watch setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---- end notifications ----
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token (`/auth/login`), personal API token (`/auth/tokens`) or service-account key.
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: The bearer token as a query parameter; accepted on GET requests only (for `EventSource`).
  parameters:
    CodeSearchBranch:
      name: branch
      in: query
      required: false
      description: "v0.7 (§15.9). Search this branch instead of the default branch (trees without it contribute nothing). Not combinable with `branches=all`."
      schema:
        type: string
    CodeSearchBranches:
      name: branches
      in: query
      required: false
      description: "v0.7 (§15.9). `all` searches every branch tip (the default branch and the most recently updated others, up to `--code-index-branches` per tree, default 10), default branch first; a file version already searched on an earlier branch is reported once."
      schema:
        type: string
        enum: [default, all]
        default: default
    Tenant:
      name: tenant
      in: path
      required: true
      description: Tenant slug (or tenant id).
      schema:
        type: string
    Tree:
      name: tree
      in: path
      required: true
      description: Tree name within the tenant.
      schema:
        type: string
    BackupID:
      name: id
      in: path
      required: true
      description: "Backup id (`bk-<yyyymmdd>T<hhmmss>Z-<6 hex>`). storage-backends (§15.2)."
      schema:
        type: string
        pattern: "^bk-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$"
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items (positive integer; larger values are clamped).
      schema:
        type: integer
        minimum: 1
  headers:
    RetryAfter:
      description: Seconds until the rate limit allows another request.
      schema:
        type: integer
  responses:
    NoContent:
      description: Done; no body.
    BadRequest:
      description: "`bad_request`: invalid parameters or body (also `415 unsupported_media_type`, `413 payload_too_large` for oversized bodies)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthenticated`: authentication required or the token is invalid."
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden` (or a feature-specific code): the caller may not perform the action."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`not_found`: the resource does not exist or is not visible to the caller."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "`conflict` (or a feature-specific code): the request conflicts with the current state."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "`payload_too_large`: the request body exceeds the limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: "`unsupported_media_type`: the request body must be application/json."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnavailableForLegalReasons:
      description: "`license_restricted`: a license rule forbids reading this content."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: "`rate_limited`: the per-principal rate limit was exceeded."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: "`internal`: unexpected server error (details are logged, not returned)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: "`not_implemented`: the feature's service is not configured on this server."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    APIToken:
      type: object
      required: [id, account_id, name, created_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        kind:
          type: string
          description: "v0.4 IAM (§12). Empty Kind is treated as TokenSession when Name is \"session\", else TokenAPI (tokens created before v0.4)."
        service_account_id:
          type: string
          description: "TokenService only (AccountID empty)"
        scopes:
          type: array
          items:
            type: string
        mfa:
          type: boolean
          description: "session created after a second factor"
        last_ip:
          type: string
        user_agent:
          type: string
    AccessConfigDoc:
      type: object
      description: "AccessConfigDoc is the last applied declarative access document of a tenant (TreeID \"\") or tree."
      required: [tenant_id, kind, content, hash, updated_by, updated_at]
      properties:
        tenant_id:
          type: string
        tree_id:
          type: string
        kind:
          type: string
          description: "\"roles\" | \"policies\" | \"license\" | \"combined\""
        content:
          type: [string, "null"]
          contentEncoding: base64
        hash:
          type: string
          description: "hex BLAKE3 of Content"
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time
    AccessConfigRequest:
      type: object
      description: "accessConfigRequest is the body of plan / apply. Content is the canonical JSON object; a JSON string holding the document is accepted too."
      properties:
        content:
          description: "Any JSON value."
    AccessConfigResult:
      type: object
      description: "Result of an access-config plan or apply (accesscfg.Result). When accepted is false, errors explains why and nothing was changed."
      required: [accepted, errors, changes]
      properties:
        accepted:
          type: boolean
        errors:
          type: [array, "null"]
          items:
            type: string
        changes:
          type: [array, "null"]
          items:
            type: string
          description: "Human-readable plan lines (\"create role ...\", \"update policy ...\", \"delete ...\")."
    Account:
      type: object
      required: [id, username, email, display_name, tenant_id, is_admin, disabled, created_at]
      properties:
        id:
          type: string
        username:
          type: string
          description: "unique, also the slug of the personal tenant"
        email:
          type: string
        display_name:
          type: string
        tenant_id:
          type: string
          description: "personal tenant"
        is_admin:
          type: boolean
          description: "server-wide admin"
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    ActionInfo:
      type: object
      description: "ActionInfo describes one authorization action (GET /api/v1/iam/actions)."
      required: [action, description, area]
      properties:
        action:
          type: string
        description:
          type: string
        area:
          type: string
          description: "the part before ':', e.g. \"tree\""
    ActivityDay:
      type: object
      required: [date, snapshots]
      properties:
        date:
          type: string
        snapshots:
          type: integer
    AppliedSuggestion:
      type: object
      description: "AppliedSuggestion is the result of POST .../comments/{id}/apply (review.AppliedSuggestion): the updated comment and the snapshot written on the source branch."
      required: [comment, snapshot]
      properties:
        comment:
          anyOf:
            - $ref: "#/components/schemas/ReviewComment"
            - type: "null"
        snapshot:
          anyOf:
            - $ref: "#/components/schemas/Snapshot"
            - type: "null"
    ApplySuggestionRequest:
      type: object
      description: "applySuggestionRequest is the optional body of POST .../comments/{id}/apply."
      properties:
        message:
          type: string
          description: "message of the snapshot (default: \"Apply suggestion to PATH (!N, comment #ID)\")"
    Approval:
      type: object
      required: [account_id, username, at]
      properties:
        account_id:
          type: string
        username:
          type: string
        at:
          type: string
          format: date-time
        snapshot_id:
          type: string
          description: "v0.5 (§13). An approval counts only while SnapshotID equals the current source tip (\"\" = recorded before v0.5: counts). Decision \"\" = ReviewApproved."
        decision:
          type: string
        body:
          type: string
    ApprovalSummary:
      type: object
      description: "ApprovalSummary counts the approvals of a merge request (review.ApprovalSummary)."
      required: [required, current, stale, changes_requested]
      properties:
        required:
          type: integer
        current:
          type: integer
          description: "approvals of the current source tip"
        stale:
          type: integer
          description: "approvals of an older source tip"
        changes_requested:
          type: [array, "null"]
          items:
            type: string
          description: "ChangesRequested lists the reviewers whose change request is open."
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_id, actor, action, resource_type, resource_id, at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          description: "username, \"anonymous\" or \"system\""
        action:
          type: string
          description: "e.g. \"branch.push\", \"tree.create\", \"auth.login\""
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
        remote_addr:
          type: string
        at:
          type: string
          format: date-time
    AuthProviders:
      type: object
      required: [password, registration, sso]
      properties:
        password:
          type: boolean
        registration:
          type: boolean
        sso:
          $ref: "#/components/schemas/SSOProviderInfo"
    # ---- storage-backends (§15.2) ----
    BackupConfig:
      type: object
      description: "Backup configuration (server flags `--backup-interval`, `--backup-keep`)."
      required: [dir, interval, interval_seconds, keep]
      properties:
        dir:
          type: string
          description: "Directory on the server holding the archives (`<data>/backups`)."
        interval:
          type: string
          description: "Schedule as a Go duration (`0s` = no scheduled backups)."
        interval_seconds:
          type: integer
          format: int64
        keep:
          type: integer
          description: "Scheduled backups kept (0 keeps all). Backups created by people are never pruned."
    BackupInfo:
      type: object
      description: "BackupInfo describes one server backup."
      required: [id, path, size_bytes, objects, created_at, created_by]
      properties:
        id:
          type: string
        path:
          type: string
          description: "file path on the server"
        size_bytes:
          type: integer
          format: int64
          description: "Archive size."
        objects:
          type: integer
          format: int64
          description: "Objects in the archive (0 for unindexed archives)."
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: "Username, `system` for scheduled backups, empty for unindexed archives."
        note:
          type: string
    BackupStatus:
      type: object
      description: "Response of GET /api/v1/admin/backups."
      required: [config, store, supported, running, backups]
      properties:
        config:
          $ref: "#/components/schemas/BackupConfig"
        store:
          $ref: "#/components/schemas/BackupStoreInfo"
        supported:
          type: boolean
          description: "False when this server's stores cannot be backed up (e.g. an in-memory metadata store)."
        running:
          type: boolean
          description: "A backup is being written now."
        next_run_at:
          type: string
          format: date-time
          description: "Next scheduled backup (absent when there is no schedule)."
        last_error:
          type: string
          description: "Failure of the last scheduled backup, if it failed."
        backups:
          type: array
          description: "Newest first."
          items:
            $ref: "#/components/schemas/BackupInfo"
    BackupStoreInfo:
      type: object
      description: "The object store being backed up (`--object-store`)."
      required: [kind, compress]
      properties:
        kind:
          type: string
          enum: [disk, s3, other]
        root:
          type: string
          description: "Disk store: the data directory."
        endpoint:
          type: string
          description: "S3: host[:port] of the API."
        bucket:
          type: string
        prefix:
          type: string
          description: "S3: key prefix (empty or ending in `/`)."
        region:
          type: string
        secure:
          type: boolean
          description: "S3: HTTPS."
        compress:
          type: boolean
          description: "New objects are stored WTZ1-compressed (`--compress-objects`)."
    CreateBackupRequest:
      type: object
      description: "CreateBackupRequest is the (optional) body of POST /api/v1/admin/backups."
      properties:
        note:
          type: string
          maxLength: 500
          description: "Note is a free-form description stored with the backup."
    # ---- end storage-backends ----
    BlameLine:
      type: object
      description: "BlameLine attributes one line of a file to the snapshot that last changed it."
      required: [line, text, snapshot_id, author, message, at]
      properties:
        line:
          type: integer
          description: "1-based"
        text:
          type: string
        snapshot_id:
          type: string
        author:
          type: string
        message:
          type: string
          description: "first line"
        at:
          type: string
          format: date-time
    BlameResponse:
      type: object
      description: "blameResponse is the body of GET {tree}/blame/{rev}/{path...}."
      required: [lines, snapshot]
      properties:
        lines:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/BlameLine"
          description: "The file's lines (or the requested range), in order."
        snapshot:
          $ref: "#/components/schemas/Snapshot"
          description: "the snapshot REV resolved to"
    Branch:
      type: object
      required: [tree_id, name, tip, protected, created_at, updated_at]
      properties:
        tree_id:
          type: string
        name:
          type: string
        tip:
          type: string
          description: "snapshot id; \"\" for an empty branch"
        protected:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BranchProtection:
      type: object
      description: "BranchProtection applies to every branch whose name matches Pattern (path.Match glob, e.g. \"main\" or \"release/*\")."
      required: [tree_id, pattern, no_direct_push, required_approvals, allowed_pushers, no_delete]
      properties:
        tree_id:
          type: string
        pattern:
          type: string
        no_direct_push:
          type: boolean
          description: "changes only via merge requests"
        required_approvals:
          type: integer
          description: "for MR merge"
        allowed_pushers:
          type: [array, "null"]
          items:
            type: string
          description: "usernames; empty = role-based only"
        no_delete:
          type: boolean
        require_ci_pass:
          type: boolean
          description: "v0.5 (§13). every RequiredChecks context must be success on the source tip"
        required_checks:
          type: array
          items:
            type: string
          description: "CI contexts; empty with RequireCIPass = all reported checks"
        require_signed:
          type: boolean
          description: "pushed snapshots must carry a verified signature"
        require_linear:
          type: boolean
          description: "no merge snapshots"
        block_on_todos:
          type: boolean
          description: "open blocking TODOs of the source branch block merging"
        merge_methods:
          type: array
          items:
            type: string
            enum: [fast-forward, merge, squash]
          description: "v0.6 (§14.1): merge methods allowed into matching branches (empty = all). The lists of all matching rules intersect. `require_linear` also forbids `merge`, `require_signed` forbids `merge` and `squash`. Unknown names answer 400; the stored list is deduplicated in preference order (fast-forward, merge, squash)."
        require_owner_approval:
          type: boolean
          description: "v0.7 (§15.7): every path a merge request changes needs an approval of the current source tip from one of the path's owners (`GET .../owners`); missing approvals answer `409 merge_blocked` (blocker kind `owners`)."
    CICombinedStatus:
      type: object
      description: "Combined CI view of one snapshot (ci.Status). state is failure if any check failed or errored, else pending if any is pending, else success; \"\" when no check was reported."
      required: [snapshot, state, checks]
      properties:
        snapshot:
          type: string
        state:
          type: string
          enum: ["", pending, success, failure, error]
        checks:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CIStatus"
    CIReport:
      type: object
      description: "Body of POST {tree}/ci/status (ci.Report). snapshot is a revision of the tree (id, branch, tag or unique id prefix) and is resolved to a snapshot id."
      required: [snapshot, context, state]
      properties:
        snapshot:
          type: string
        context:
          type: string
          description: "Name of the check (e.g. \"ci/build\")."
        state:
          type: string
          enum: [pending, success, failure, error]
        description:
          type: string
        target_url:
          type: string
    CIStatus:
      type: object
      description: "CIStatus is one check result for a snapshot (keyed by tree, snapshot, context; a newer report replaces the older one)."
      required: [tree_id, snapshot_id, context, state, reporter, updated_at]
      properties:
        tree_id:
          type: string
        snapshot_id:
          type: string
        context:
          type: string
          description: "check name, e.g. \"ci/build\""
        state:
          type: string
        description:
          type: string
        target_url:
          type: string
        reporter:
          type: string
          description: "username or \"sa:<tenant>/<name>\""
        updated_at:
          type: string
          format: date-time
    CISummary:
      type: object
      description: "CISummary is the CI state of the source tip (review.CISummary)."
      required: [state, required, missing]
      properties:
        state:
          type: string
          description: "combined state of every reported check (\"\" = none)"
        required:
          type: [array, "null"]
          items:
            type: string
          description: "required contexts (RequireCIPass)"
        missing:
          type: [array, "null"]
          items:
            type: string
          description: "required contexts without a report"
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
    CodeIndexBranch:
      type: object
      description: "CodeIndexBranch is the index status of one branch of a tree."
      required: [branch, snapshot_id, manifest, files, bytes, symbols, reused, built_at, build_ms, loaded, building]
      properties:
        branch:
          type: string
        snapshot_id:
          type: string
        manifest:
          type: string
        files:
          type: integer
        bytes:
          type: integer
          format: int64
        symbols:
          type: integer
        reused:
          type: integer
        built_at:
          type: string
          format: date-time
        build_ms:
          type: integer
          format: int64
        loaded:
          type: boolean
          description: "segment in memory"
        building:
          type: boolean
        error:
          type: string
    CodeIndexRebuildResult:
      type: object
      description: "RebuildResult is the answer to a rebuild."
      required: [rebuilt, trees]
      properties:
        rebuilt:
          type: integer
        trees:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CodeIndexTree"
    CodeIndexStatus:
      type: object
      description: "IndexStatus describes the whole code index."
      required: [format_version, persistent, memory_bytes, memory_limit, loaded_segments, evictions, disk_bytes, max_branches, builds, disk_loads, trees]
      properties:
        format_version:
          type: integer
        persistent:
          type: boolean
          description: "Persistent reports whether indexes are kept on disk."
        memory_bytes:
          type: integer
          format: int64
          description: "MemoryBytes is the size of the decoded segments in memory; MemoryLimit their cap (0 = unlimited)."
        memory_limit:
          type: integer
          format: int64
        loaded_segments:
          type: integer
        evictions:
          type: integer
          format: int64
          description: "Evictions counts segments dropped from memory since the start."
        disk_bytes:
          type: integer
          format: int64
        max_branches:
          type: integer
          description: "MaxBranches is the most branches indexed per tree."
        builds:
          type: integer
          format: int64
          description: "Builds counts segments built since the server started; DiskLoads segments loaded from disk."
        disk_loads:
          type: integer
          format: int64
        trees:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CodeIndexTree"
    CodeIndexTree:
      type: object
      description: "CodeIndexTree is the index status of one tree."
      required: [tree_id, tenant, tree, default_branch, state, files, bytes, symbols, trigrams, built_at, branch_count, segments, memory_bytes, disk_bytes, branches]
      properties:
        tree_id:
          type: string
        tenant:
          type: string
        tree:
          type: string
        default_branch:
          type: string
        state:
          type: string
          description: "State is \"ready\", \"building\" or \"error\"."
        files:
          type: integer
          description: "Files, Bytes, Symbols and Trigrams describe the default branch."
        bytes:
          type: integer
          format: int64
        symbols:
          type: integer
        trigrams:
          type: integer
        built_at:
          type: string
          format: date-time
          description: "default branch; zero when not built yet"
        branch_count:
          type: integer
        segments:
          type: integer
          description: "Segments counts distinct manifests (branches with identical tips share one)."
        memory_bytes:
          type: integer
          format: int64
        disk_bytes:
          type: integer
          format: int64
        branches:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/CodeIndexBranch"
        error:
          type: string
    CodeSearchHit:
      type: object
      description: "CodeSearchHit is one matching line of a code search."
      required: [tenant, tree, branch, snapshot_id, path, line, text]
      properties:
        tenant:
          type: string
        tree:
          type: string
        branch:
          type: string
        snapshot_id:
          type: string
        path:
          type: string
        line:
          type: integer
          description: "1-based"
        text:
          type: string
        before:
          type: array
          items:
            type: string
          description: "context lines"
        after:
          type: array
          items:
            type: string
    CodeSearchResult:
      type: object
