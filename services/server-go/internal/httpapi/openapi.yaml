                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or a tag protection denial."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/trees/{tenant}/{tree}/staged:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listStaged
      summary: List staged snapshots
      description: Staged (work-in-progress) snapshots of the tree, optionally for one branch.
      tags: [Staged]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
