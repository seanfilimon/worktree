      tags: [IAM]
      x-wt-action: iam:read
      parameters:
        - name: tenant
          in: query
          required: false
          description: "Tenant slug or id. Defaults to the prefix of a `tenant/tree` value of `tree`, or a service account's own tenant; required otherwise."
          schema:
