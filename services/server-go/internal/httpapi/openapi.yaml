        tree_id:
          type: string
        branch_name:
          type: string
        parents:
          type: [array, "null"]
          items:
            type: string
        manifest_hash:
          type: string
        author:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
        auto_generated:
          type: boolean
        pushed_by:
          type: string
          description: "account id"
        pushed_at:
          type: string
          format: date-time
        dependencies:
          type: array
