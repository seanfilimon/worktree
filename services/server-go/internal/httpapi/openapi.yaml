          description: "\"SHA256:\" + base64 of sha256(public key), unpadded"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    SimulateContext:
      type: object
      required: [ip, mfa]
      properties:
        ip:
          type: string
        mfa:
          type: boolean
    SimulatePrincipal:
      type: object
      required: [type, name, tenant]
      properties:
        type:
          type: string
          description: "\"user\" | \"service_account\" (\"sa\" accepted)"
        name:
          type: string
        tenant:
          type: string
          description: "service accounts: owning tenant (default: the request tenant)"
    SimulateRequest:
      type: object
      properties:
        principal:
          anyOf:
            - $ref: "#/components/schemas/SimulatePrincipal"
            - type: "null"
          description: "nil = the caller"
        action:
          type: string
        tenant:
          type: string
        tree:
          type: string
        branch:
          type: string
        path:
          type: string
        context:
          $ref: "#/components/schemas/SimulateContext"
        candidate_policies:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Policy"
          description: "CandidatePolicies, when present, replace the tenant's stored policies for this evaluation: a dry run of a policy change (§13.7). Only enabled candidates take part; [] simulates having no policies."
    Snapshot:
      type: object
      required: [id, tree_id, branch_name, parents, manifest_hash, author, message, created_at, auto_generated, pushed_by, pushed_at]
      properties:
        id:
          type: string
        tree_id:
          type: string
        branch_name:
          type: string
        parents:
          type: [array, "null"]
          items:
            type: string
        manifest_hash:
          type: string
        author:
          type: string
        message:
          type: string
        created_at:
          type: string
          format: date-time
        auto_generated:
          type: boolean
        pushed_by:
          type: string
          description: "account id"
        pushed_at:
          type: string
          format: date-time
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/Dependency"
          description: "v0.5 (§13)."
        reverts:
          type: string
        signature:
          type: string
          contentEncoding: base64
        signing_key_id:
          type: string
        verified:
          type: boolean
          description: "Verified is set by the server when Signature verified against a registered, unrevoked key (of any account) at push time."
    SnapshotDetail:
      type: object
      required: [snapshot, files, restricted_count]
      properties:
        snapshot:
          $ref: "#/components/schemas/Snapshot"
        files:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/FileEntry"
        restricted_count:
          type: integer
          description: "RestrictedCount is the number of files left out of Files because the caller may not read them (path policies or license rules, §13.1)."
    StagedAuthorActivity:
      type: object
      required: [author, account_id, files, staged_at]
      properties:
        author:
          type: string
        account_id:
          type: string
        files:
          type: integer
        staged_at:
          type: string
          format: date-time
    StagedBranchActivity:
      type: object
      description: "stagedBranchActivity is StagedBranchActivity of apps/admin/src/api/types.ts."
      required: [branch, authors, files_changed, latest_at, overlaps]
      properties:
        branch:
          type: string
        authors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/StagedAuthorActivity"
        files_changed:
          type: integer
        latest_at:
          type: string
          format: date-time
        overlaps:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/StagedFileOverlap"
    StagedFileOverlap:
      type: object
      required: [path, authors, branches]
      properties:
        path:
          type: string
        authors:
          type: [array, "null"]
          items:
            type: string
        branches:
          type: [array, "null"]
          items:
            type: string
    StagedSnapshot:
      type: object
      description: "StagedSnapshot is a WIP snapshot visible to the team but not part of branch history. At most one per (tree, account, branch): a newer stage replaces the older one."
      required: [snapshot_id, tree_id, tenant_id, account_id, author, branch_name, files_changed, files_added, files_modified, files_deleted, message, staged_at]
      properties:
        snapshot_id:
          type: string
        tree_id:
          type: string
        tenant_id:
          type: string
        account_id:
          type: string
        author:
          type: string
        branch_name:
          type: string
        files_changed:
          type: [array, "null"]
          items:
            type: string
        files_added:
          type: integer
        files_modified:
          type: integer
        files_deleted:
          type: integer
        message:
          type: string
        staged_at:
          type: string
          format: date-time
        manifest_hash:
          type: string
          description: "v0.5: hex BLAKE3 of the staged working manifest (\"\" when the client sent none). It keeps the staged content alive and downloadable."
    SystemInfo:
      type: object
      required: [version, go_version, os, arch, started_at, uptime_seconds, allow_registration, data_dir, num_cpu, num_goroutine, memory, storage, event_bus]
      properties:
        version:
          type: string
        go_version:
          type: string
        os:
          type: string
        arch:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: int64
        allow_registration:
          type: boolean
        data_dir:
          type: string
        num_cpu:
          type: integer
        num_goroutine:
          type: integer
        memory:
          $ref: "#/components/schemas/SystemMemory"
        storage:
          $ref: "#/components/schemas/SystemStorage"
        event_bus:
          type: object
          required: [published, delivered, dropped, subscribers]
          properties:
            published:
              type: integer
              format: int64
            delivered:
              type: integer
              format: int64
            dropped:
              type: integer
              format: int64
            subscribers:
              type: integer
    SystemMemory:
      type: object
      required: [alloc_bytes, sys_bytes, heap_inuse_bytes, gc_runs]
      properties:
        alloc_bytes:
          type: integer
          format: int64
        sys_bytes:
          type: integer
          format: int64
        heap_inuse_bytes:
          type: integer
          format: int64
        gc_runs:
          type: integer
    SystemStorage:
      type: object
      required: [objects, object_bytes, meta_db_bytes]
      properties:
        objects:
          type: integer
          format: int64
        object_bytes:
          type: integer
          format: int64
        meta_db_bytes:
          type: integer
          format: int64
    Tag:
      type: object
      required: [tree_id, name, target, message, tagger, created_at]
      properties:
        tree_id:
          type: string
        name:
          type: string
        target:
          type: string
          description: "snapshot id"
        message:
          type: string
        tagger:
          type: string
        created_at:
          type: string
          format: date-time
    TagProtection:
      type: object
      description: "TagProtection applies to tags matching Pattern (path.Match glob)."
      required: [tree_id, pattern, no_delete, no_move]
      properties:
        tree_id:
          type: string
        pattern:
          type: string
        no_delete:
          type: boolean
        no_move:
          type: boolean
        allowed_taggers:
          type: array
          items:
            type: string
          description: "usernames; empty = tree:write"
    Team:
      type: object
      description: "Team is a named group of accounts inside a tenant."
      required: [id, tenant_id, slug, name, description, created_at, updated_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        slug:
          type: string
          description: "unique within tenant, [a-z0-9-]"
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamDetail:
      type: object
      required: [team, members, grants]
      properties:
        team:
          anyOf:
            - $ref: "#/components/schemas/Team"
            - type: "null"
        members:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/TeamMemberView"
        grants:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Grant"
    TeamMember:
      type: object
      required: [team_id, account_id, role, created_at]
      properties:
        team_id:
          type: string
        account_id:
          type: string
        role:
          type: string
          description: "TeamRoleMaintainer | TeamRoleMember"
        created_at:
          type: string
          format: date-time
    TeamMemberView:
      type: object
      required: [account, role]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        role:
          type: string
    TeamRoleView:
      type: object
      required: [team, role]
      properties:
        team:
          type: string
          description: "slug"
        role:
          type: string
          description: "team role: maintainer | member"
    Tenant:
      type: object
      required: [id, slug, name, kind, plan, created_at]
      properties:
        id:
          type: string
        slug:
          type: string
          description: "lowercase [a-z0-9-], unique"
        name:
          type: string
        kind:
          type: string
          description: "TenantUser | TenantOrg"
        plan:
          type: string
          description: "\"free\" | \"pro\" | \"enterprise\""
        created_at:
          type: string
          format: date-time
        status:
          type: string
          description: "v0.5 (§13). Status \"\" = TenantActive."
        status_reason:
          type: string
        limits:
          $ref: "#/components/schemas/TenantLimits"
    TenantLimits:
      type: object
      description: "TenantLimits are per-tenant quotas. Zero values mean \"server default\" (which is itself unlimited unless configured)."
      properties:
        max_trees:
          type: integer
        max_storage_bytes:
          type: integer
          format: int64
        max_branches_per_tree:
          type: integer
        max_members:
          type: integer
        requests_per_minute:
          type: integer
    TenantUsage:
      type: object
      description: "Usage of a tenant against its limits (limits.Usage). limits are the tenant's own overrides, effective the limits in force (tenant overrides on top of the server defaults; 0 = unlimited)."
      required: [trees, branches, members, storage_bytes, limits, effective]
      properties:
        trees:
          type: integer
        branches:
          type: integer
        members:
          type: integer
        storage_bytes:
          type: integer
          format: int64
        limits:
          $ref: "#/components/schemas/TenantLimits"
        effective:
          $ref: "#/components/schemas/TenantLimits"
    TimeWindow:
      type: object
      description: "TimeWindow is a recurring weekly window, e.g. office hours."
      required: [days, start, end, timezone]
      properties:
        days:
          type: [array, "null"]
          items:
            type: string
          description: "\"mon\"..\"sun\"; empty = every day"
        start:
          type: string
          description: "\"09:00\""
        end:
          type: string
          description: "\"18:00\" (exclusive; may wrap midnight)"
        timezone:
          type: string
          description: "IANA name, default \"UTC\""
    Todo:
      type: object
      description: "Todo is work requested from a tree by a dependency declared in another tree's snapshot. It lives in the *target* tree (TreeID)."
      required: [id, tenant_id, tree_id, number, target_branch, title, priority, blocking, linked, status, source_tenant_id, source_tree_id, source_branch, source_snapshot_id, created_by, author, created_at, updated_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
          description: "target tree's tenant"
        tree_id:
          type: string
          description: "target tree"
        number:
          type: integer
          description: "per target tree, from 1"
        target_branch:
          type: string
        title:
          type: string
        details:
          type: string
        priority:
          type: string
        blocking:
          type: boolean
        linked:
          type: boolean
        status:
          type: string
        source_tenant_id:
          type: string
        source_tree_id:
          type: string
        source_branch:
          type: string
        source_snapshot_id:
          type: string
        created_by:
          type: string
          description: "account id of the pusher"
        author:
          type: string
          description: "username of the pusher"
        assignee_id:
          type: string
        assignee:
          type: string
        resolved_by:
          type: string
          description: "snapshot that completed it"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
    TodoCreateRequest:
      type: object
      description: "Body of POST {tree}/todos (todo.CreateInput): a manual TODO."
      properties:
        title:
          type: string
        details:
          type: string
        priority:
          type: string
          enum: ["", low, medium, high, critical]
        blocking:
          type: boolean
        target_branch:
          type: string
          description: "Branch the TODO blocks (merge requests from it are blocked while it is open and blocking)."
    TodoList:
      type: object
      required: [todos]
      properties:
        todos:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Todo"
    TodoPatchRequest:
      type: object
      description: "Body of PATCH {tree}/todos/{n} (todo.Patch). Absent or null fields are left unchanged. Closing (done/cancelled) sets closed_at; reopening clears closed_at and resolved_by."
      properties:
        title:
          type: [string, "null"]
        details:
          type: [string, "null"]
        priority:
          type: [string, "null"]
          enum: [low, medium, high, critical, null]
        blocking:
          type: [boolean, "null"]
        status:
          type: [string, "null"]
          enum: [open, in_progress, done, cancelled, null]
    TodoRef:
      type: object
      description: "The TODO created in the target tree for an outgoing dependency (todo.TodoRef)."
      required: [tenant, tree, number, status]
      properties:
        tenant:
          type: string
        tree:
          type: string
        number:
          type: integer
        status:
          type: string
        title:
          type: string
    TodoSummary:
      type: object
      description: "TodoSummary counts the open blocking TODOs of the source branch (review.TodoSummary)."
      required: [blocking_open]
      properties:
        blocking_open:
          type: integer
    Tree:
      type: object
      required: [id, tenant_id, name, description, default_branch, visibility, created_at, updated_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
          description: "unique within tenant"
        description:
          type: string
        default_branch:
          type: string
        visibility:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TreeStats:
      type: object
      description: "treeStats is TreeStats of apps/admin/src/api/types.ts."
      required: [branch, snapshot_count, contributors, activity, file_count, total_bytes, languages]
      properties:
        branch:
          type: string
        snapshot_count:
          type: integer
        contributors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ContributorStat"
        activity:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ActivityDay"
        file_count:
          type: integer
        total_bytes:
          type: integer
          format: int64
        languages:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/LanguageShare"
    TreeSummary:
      type: object
      description: "treeSummary is the list/detail view of a tree."
      required: [tree, branch_count, snapshot_count, staged_count, open_mr_count]
      properties:
        tree:
          $ref: "#/components/schemas/Tree"
        branch_count:
          type: integer
        snapshot_count:
          type: integer
        staged_count:
          type: integer
        open_mr_count:
          type: integer
    UnstageResponse:
      type: object
      description: "unstageResponse is the body of DELETE {tree}/staged."
      required: [removed]
      properties:
