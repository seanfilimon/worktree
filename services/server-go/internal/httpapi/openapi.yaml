            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigDoc"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: the tenant does not exist or no access document has been applied to it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config/plan:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: planTenantAccessConfig
      summary: Plan a tenant access document
      description: |
        Dry run: validates the canonical JSON document (`{"roles":[...],
        "policies":[...]}`; a JSON string holding it is accepted too),
        checks for privilege escalation and returns the changes it would
        make to config-managed roles and policies. Validation failures
        answer 200 with `accepted: false` and `errors`.
      tags: [Access]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config/apply:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: applyTenantAccessConfig
      summary: Apply a tenant access document
      description: |
        Like plan, then atomically replaces the config-managed roles and
        policies (`managed_by: config`) and stores the document. Audited as
        `access.applied`; publishes `access.applied`. Rejected documents
        answer 200 with `accepted: false` and change nothing.
      tags: [Access]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessConfigRequest"
      responses:
        "200":
          description: The applied plan (or the rejection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessConfigResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
