          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/approve:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: approveMR
      summary: Approve a merge request
      description: |
        Records an approval of the current source tip (same as a review with
        decision `approved`). Authors cannot approve their own merge
        request. Publishes `mr.approved`.
      tags: [MergeRequests]
      x-wt-action: mr:approve
      responses:
        "200":
          description: The updated merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/merge:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: mergeMR
      summary: Merge a merge request
      description: |
        Merges the source branch into the target branch with `method`
        (v0.6, §14.1): `fast-forward` moves the target to the source tip;
        `merge` writes a server-side merge snapshot (parents: target tip,
        source tip) with the three-way merge of both sides; `squash` writes
        one snapshot (parent: target tip) with the combined changes. Merge
        and squash snapshots are authored and pushed by the caller. Without
        a method (or without a body) the default is the first of
        fast-forward, merge, squash that is allowed and possible (see
        `GET .../mergeability`). The target moves with a compare-and-swap;
        when it already contains the source the merge request is just
        marked merged. `merge_method` of the result records the method.

        Missing approvals answer `403 review_required`. Other readiness
        failures (changes requested, CI, blocking TODOs, linear history for
        a fast-forward) answer `409 merge_blocked`, members of a linked
        group `409 linked_group`, a method refused by branch protection
        (`merge_methods`, `require_linear`, `require_signed`) or not
        available on the server `409 merge_method_not_allowed`, a
        conflicting three-way merge `409 merge_conflict` (body
        `MergeConflictError` with the conflicting paths), and a merge
        request that is not open, a diverged target for a fast-forward or a
        target that moved concurrently `409 conflict`. Without the v0.6
        merge service only fast-forward is available (other methods answer
        501). Publishes `mr.merged` (and `branch.pushed` with
        `merge_method` when the target moved).
      tags: [MergeRequests]
      x-wt-action: mr:merge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeMRRequest"
      responses:
        "200":
          description: The merged merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or `review_required` when required approvals of the current source tip are missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`merge_blocked` (v0.7: including missing owner approvals, blocker `owners`), `linked_group`, `merge_method_not_allowed`, `draft` (v0.7: a draft merge request), `quota_exceeded` (v0.7: the merge or squash snapshot would exceed the tenant storage quota) or `conflict` (Error); `merge_conflict` (MergeConflictError, the conflicting paths both at the top level and in `error`)."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MergeConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/close:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: closeMR
      summary: Close a merge request
      description: The author may close their own merge request; others need `mr:merge`. Publishes `mr.closed`.
      tags: [MergeRequests]
      x-wt-action: [self, 'mr:merge']
      responses:
        "200":
          description: The closed merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/audit:
    get:
      operationId: audit
      summary: Query the audit log
      description: |
        With `tenant` the caller needs `tenant:admin` on it. Without one,
        server admins see every tenant's events and other accounts the
        merged events of the tenants they administer (empty if none).
        Newest first. `format=ndjson` streams every match (no limit) as
        `application/x-ndjson`.
      tags: [Audit]
      x-wt-action: ['tenant:admin', 'server:admin']
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant slug or id.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Exact action (`tree.create`) or a prefix pattern (`iam.*`).
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Inclusive lower bound (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Exclusive upper bound (RFC 3339).
          schema:
            type: string
