          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the TODO is already done."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/todos/{n}/cancel:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: TODO number (positive integer).
        schema:
          type: integer
          minimum: 1
    post:
      operationId: cancelTodo
      summary: Cancel a TODO
      description: Marks the TODO `cancelled`. Publishes `todo.updated`.
      tags: [Todos]
      x-wt-action: tree:write
      responses:
        "200":
          description: The cancelled TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the TODO is already done or cancelled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/dependencies:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: dependencies
      summary: Dependency report
      description: Outgoing dependencies declared by snapshots of the branch (with the TODOs they created) and the TODOs other trees created in this tree.
      tags: [Todos]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch name (default the tree's default branch).
          schema:
            type: string
      responses:
        "200":
          description: The dependency report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/releases:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listReleases
      summary: List releases
      description: Releases of the tree, newest first. Drafts are included only for callers with `release:create`.
      tags: [Releases]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The releases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createRelease
      summary: Create a release
      description: |
        Creates a release for `tag`. When the tag does not exist it is created
        at `snapshot` (a revision of the tree; the name must satisfy the
        ref-name rules). Publishes `release.created`.
      tags: [Releases]
      x-wt-action: release:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseRequest"
      responses:
        "201":
          description: The new release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a release for the tag exists, or the tag exists at a different snapshot."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/releases/{tag}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: tag
        in: path
        required: true
        description: Tag name of the release (a '/' in the tag is passed percent-encoded as %2F).
        schema:
          type: string
    get:
      operationId: getRelease
      summary: Get a release
      description: Drafts are visible only to callers with `release:create` (404 otherwise).
      tags: [Releases]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: patchRelease
      summary: Update a release
      description: Updates name, notes, draft and/or prerelease; publishing a draft sets `published_at`.
      tags: [Releases]
      x-wt-action: release:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleasePatchRequest"
      responses:
        "200":
          description: The updated release.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteRelease
      summary: Delete a release
      description: Deletes the release and its assets; the tag stays. Publishes `release.deleted`.
      tags: [Releases]
      x-wt-action: release:delete
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/releases/{tag}/assets/{name}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: tag
        in: path
        required: true
        description: Tag name of the release (a '/' in the tag is passed percent-encoded as %2F).
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Asset file name.
        schema:
          type: string
    put:
      operationId: putReleaseAsset
      summary: Upload a release asset
      description: |
        Stores the raw request body (at most 64 MiB) as the asset, replacing
        an asset of the same name. The request `Content-Type` is recorded as
        the asset's media type.
      tags: [Releases]
      x-wt-action: release:create
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The stored asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the release already holds the maximum number of assets."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      operationId: getReleaseAsset
      summary: Download a release asset
      description: "The asset bytes with its recorded `Content-Type` (default `application/octet-stream`), `Content-Disposition: attachment`, `ETag` and `Last-Modified`; `Range` and conditional requests are honoured."
      tags: [Releases]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The asset content.
          headers:
            Content-Disposition:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (Range request).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (conditional request).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The requested range cannot be satisfied.
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteReleaseAsset
      summary: Delete a release asset
      tags: [Releases]
      x-wt-action: release:delete
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/ci/status:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    post:
      operationId: reportCI
      summary: Report a CI check result
      description: |
        Records the state of one check (`context`) for a snapshot (a revision
        of the tree, resolved to its snapshot id), replacing an earlier report
        of the same context. Publishes `ci.status`.
      tags: [CI]
      x-wt-action: ci:report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CIReport"
      responses:
        "201":
          description: The stored check status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CIStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      operationId: ciStatus
      summary: Combined CI status
      description: The checks reported for a snapshot and their combined state. Pass at most one of `snapshot` and `branch` (default the default branch's tip).
      tags: [CI]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: snapshot
          in: query
          required: false
          description: Revision of the tree (id, branch, tag or unique id prefix).
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch whose tip to report (default the tree's default branch).
          schema:
            type: string
      responses:
        "200":
          description: The combined status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CICombinedStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/keys:
    get:
      operationId: listKeys
      summary: List the caller's signing keys
      tags: [Auth]
      x-wt-action: self
      responses:
        "200":
          description: The caller's signing keys (revoked keys included).
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/SigningKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createKey
      summary: Register a signing key
      description: |
        Registers an Ed25519 public key (`public_key` is standard base64 of
        the 32 key bytes; `algorithm` defaults to `ed25519`). Only user
        accounts can register keys; a public key may be registered once.
        Audited as `signing_key.create`.
      tags: [Auth]
      x-wt-action: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSigningKeyRequest"
      responses:
        "201":
          description: The registered key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`: service accounts cannot register signing keys."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict`: the public key is already registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Signing key id.
        schema:
          type: string
    delete:
      operationId: revokeKey
      summary: Revoke a signing key
      description: Revokes one of the caller's keys; signatures by it no longer verify on push. Audited as `signing_key.revoke`.
      tags: [Auth]
      x-wt-action: self
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/accounts/{username}/keys:
    parameters:
      - name: username
        in: path
        required: true
        description: Account username.
        schema:
          type: string
    get:
      operationId: accountKeys
      summary: List an account's public signing keys
      tags: [Auth]
      x-wt-action: authenticated
      responses:
        "200":
          description: The account's signing keys.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/SigningKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/iam/actions:
    get:
