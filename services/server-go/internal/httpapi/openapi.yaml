    # ---- mirrors (§15.6) ----
    Mirror:
      type: object
      description: "Mirror pushes a tree's branches and tags to a Git remote (v0.7 §15.6). The credential is never returned."
      required: [id, tenant_id, tree_id, url, has_credential, tags, active, created_by, created_at]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tree_id:
          type: string
        url:
          type: string
          description: "https://, http://, ssh:// or scp-like (user@host:path) Git remote; file:// only with --mirror-allow-local."
        has_credential:
          type: boolean
        branches:
          type: array
          items:
            type: string
          description: "Branch glob patterns ('*' within a segment, '**' across segments); empty = every branch."
        tags:
          type: boolean
          description: "Also mirror the tree's tags."
        active:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        last_sync_at:
          type: string
          format: date-time
        last_status:
          type: string
          description: "\"ok\" | \"error\" | \"running\" | \"disabled\" (no usable git binary); absent before the first sync."
        last_error:
          type: string
          description: "Why the last sync failed (credentials redacted)."
    MirrorGitStatus:
      type: object
      description: "GitStatus reports whether mirrors can run on this server."
      required: [available]
      properties:
        available:
          type: boolean
        version:
          type: string
          description: "e.g. \"2.45.1\""
        error:
          type: string
          description: "Why mirrors are disabled."
    MirrorList:
      type: object
      description: "mirrorList is the body of GET {tree}/mirrors."
      required: [mirrors, git]
      properties:
        mirrors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Mirror"
        git:
          $ref: "#/components/schemas/MirrorGitStatus"
          description: "Git reports whether the server can run mirrors."
    MirrorRefUpdate:
      type: object
      description: "RefUpdate is the push outcome of one ref."
      required: [ref, status]
      properties:
        ref:
          type: string
        new:
          type: string
          description: "The pushed object id (absent when the ref was deleted)."
        status:
          type: string
          description: "\"created\" | \"updated\" | \"forced\" | \"deleted\" | \"up_to_date\" | \"rejected\" | \"error\""
        reason:
          type: string
    MirrorSync:
      type: object
      description: "mirrorSync is the body of POST {tree}/mirrors/{id}/sync."
      required: [mirror]
      properties:
        mirror:
          $ref: "#/components/schemas/Mirror"
        result:
          $ref: "#/components/schemas/MirrorSyncResult"
    MirrorSyncResult:
      type: object
      description: "SyncResult describes one sync of a mirror."
      required: [commits, refs, pushed, duration_ms]
      properties:
        commits:
          type: integer
          description: "Commits written to the mirror's local repository (0 when nothing changed)."
        refs:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MirrorRefUpdate"
        pushed:
          type: boolean
          description: "git push ran and succeeded."
        excluded:
          type: array
          items:
            type: string
          description: "Up to 100 paths left out because their license does not permit redistribution."
        skipped:
          type: array
          items:
            type: string
          description: "Up to 100 branches, tags or paths that cannot be represented in Git."
        error:
          type: string
        duration_ms:
          type: integer
          format: int64
    CreateMirrorRequest:
      type: object
      description: "CreateInput is the body of POST {tree}/mirrors."
      properties:
        url:
          type: string
          description: "Git remote (at most 2048 bytes; no password in the URL)."
        branches:
          type: array
          items:
            type: string
          description: "Up to 50 branch glob patterns; empty = every branch."
        tags:
          type: boolean
          description: "Default true."
        credential:
          type: string
          description: "For http(s) remotes: a token (sent as x-access-token) or \"user:password\". Never returned."
        active:
          type: boolean
          description: "Default true."
    PatchMirrorRequest:
      type: object
      description: "Patch is the body of PATCH {tree}/mirrors/{id}; absent fields are unchanged."
      properties:
        url:
          type: string
        branches:
          type: array
          items:
            type: string
          description: "[] = every branch."
        tags:
          type: boolean
        credential:
          type: string
          description: "\"\" removes the credential."
        active:
          type: boolean
    # ---- end mirrors ----
    # ---- notifications (§15.3) ----
    Notification:
      type: object
      description: "Notification is one item of an account's inbox."
      required: [id, account_id, reason, event, tenant_id, title, created_at]
      properties:
        id:
          type: string
        account_id:
          type: string
        reason:
          type: string
          description: "Reason: \"review_requested\" | \"mentioned\" | \"ci_failed\" | \"todo_assigned\" | \"mr_merged\" | \"mr_commented\" | \"release\" | \"watching\"."
        event:
          type: string
          description: "bus event type that caused it"
        tenant_id:
          type: string
        tree_id:
          type: string
        title:
          type: string
        body:
          type: string
        url:
          type: string
          description: "URL is an admin-panel path, e.g. /trees/acme/web/merge-requests/3."
        actor:
          type: string
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
    WatchSetting:
      type: object
      description: "WatchSetting is an account's subscription level for a tree (or a whole tenant when TreeID is \"\")."
      required: [account_id, tenant_id, level, email, updated_at]
      properties:
        account_id:
          type: string
        tenant_id:
          type: string
        tree_id:
          type: string
        level:
          type: string
          description: "Level: \"participating\" (default: only what involves you) | \"watching\" (every merge request, release and CI failure) | \"ignoring\"."
        email:
          type: boolean
          description: "also send emails (when SMTP is configured)"
        updated_at:
          type: string
          format: date-time
    NotificationList:
      type: object
      description: "ListResult is the answer of List."
      required: [notifications, unread_count]
      properties:
        notifications:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
    NotificationSettings:
      type: object
      description: "Settings are an account's notification preferences."
      required: [email, email_configured]
      properties:
        email:
          type: boolean
          description: "Email sends participating notifications (review requests, mentions, CI failures, TODO assignments, your merge requests) by email when the server has SMTP configured and the account an email address."
        email_configured:
          type: boolean
          description: "EmailConfigured reports whether the server can send email (read-only)."
        updated_at:
          type: string
          format: date-time
    NotificationSettingsRequest:
      type: object
      description: "SettingsPatch is the body of PUT /notifications/settings."
      properties:
        email:
          type: [boolean, "null"]
    WatchRequest:
      type: object
      description: "WatchPatch is the body of PUT .../watch."
      properties:
        level:
          type: string
        email:
          type: boolean
    WatchView:
      type: object
      description: "watchView is a WatchSetting plus the names of its tenant and tree."
      required: [account_id, tenant_id, level, email, updated_at, tenant]
      properties:
        account_id:
          type: string
        tenant_id:
          type: string
        tree_id:
          type: string
        level:
          type: string
          description: "Level: \"participating\" (default: only what involves you) | \"watching\" (every merge request, release and CI failure) | \"ignoring\"."
        email:
          type: boolean
          description: "also send emails (when SMTP is configured)"
        updated_at:
          type: string
          format: date-time
        tenant:
          type: string
        tree:
          type: string
    WatchList:
      type: object
      required: [watches]
      properties:
        watches:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WatchView"
    ReadAllResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
    # ---- end notifications ----
