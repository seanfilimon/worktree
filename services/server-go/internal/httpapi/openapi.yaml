          $ref: "#/components/responses/Forbidden"
  /api/v1/search:
    get:
      operationId: search
      summary: Global search
      description: |
        Case-insensitive substring search over tenant slugs/names, tree
        names/descriptions, branch names and (server administrators only)
        account usernames/emails. The scope is the caller's member tenants
        (every tenant for server administrators) and, within them, the trees
        the caller may read. Each category holds at most `limit` hits.
      tags: [Search]
      x-wt-action: authenticated
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (1-100 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Maximum hits per category (clamped to 50).
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/search/code:
    get:
      operationId: searchCode
      summary: Code search
      description: |
        v0.6 (§14.3). Searches the text files at the default-branch tip of
        the trees in scope through a trigram index (built lazily, rebuilt
        when stale), line by line; binary and chunked files are not
        indexed. Since v0.7 (§15.9) the index is persistent (kept on disk
        across restarts, loaded lazily under a memory cap) and `branch` /
        `branches=all` select other branch tips. The scope is one
        tree (`tree=TENANT/TREE`, or `tenant=T&tree=TREE`), the trees of
        one tenant (`tenant=T`) or every tree on the server; within it only
        trees the caller may read (`tree:read`) are searched, so anonymous
        callers see public trees only. Hits in paths a path-deny policy or a
        license rule keeps from the caller are dropped. Hits are ordered by
        tenant, tree, path and line; when more than `limit` exist or the
        5-second time budget runs out, the hits found so far are returned
        with `truncated` set. An unknown tenant or tree in the scope
        answers 404, an explicit tree the caller may not read 401/403 (as
        on the tree routes).
      tags: [Search]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Literal text (at least 3 characters, no line breaks) or, with `regex=true`, an RE2 expression; at most 1000 bytes.
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: tenant
          in: query
          required: false
          description: Tenant slug (or id) to search in.
          schema:
            type: string
        - name: tree
          in: query
          required: false
          description: "`TENANT/TREE`, or a tree name together with `tenant`."
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Path glob restricting the files searched (`**`, `*`, `?`, `[...]`, anchored at the tree root; a pattern without '/' matches the file name at any depth, e.g. `*.go`).
          schema:
            type: string
        - name: regex
          in: query
          required: false
          description: Treat `q` as a regular expression.
          schema:
            type: boolean
            default: false
        - name: case
          in: query
          required: false
          description: Case-sensitive matching (default case-insensitive, with Unicode folding).
          schema:
            type: boolean
            default: false
        - name: context
          in: query
          required: false
          description: Lines of context returned before and after each hit.
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 2
        - name: limit
          in: query
          required: false
          description: Maximum number of hits (clamped to 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - $ref: "#/components/parameters/CodeSearchBranch"
        - $ref: "#/components/parameters/CodeSearchBranches"
      responses:
        "200":
          description: The hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/search/symbols:
    get:
      operationId: searchSymbols
      summary: Symbol search
      description: |
        v0.7 (§15.9). Finds definitions (functions, methods, classes,
        structs, interfaces, traits, enums, types and constants) extracted
        from Go, Rust, TypeScript/JavaScript, Python, Java and C/C++ files
        at the branch tips in scope (same scope, branch selection and
        permission filtering as `searchCode`). Names match
        case-insensitively; results are ranked exact > prefix > substring
        (an exact match in the query's case first, then shorter names),
        then ordered by name, tenant, tree, branch, path and line.
        Restricted paths never count towards `limit`.
      tags: [Search]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Symbol name or part of one (at most 200 bytes).
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: kind
          in: query
          required: false
          description: "Comma-separated kinds to return: function, method, class, struct, interface, trait, enum, type, const (default all)."
          schema:
            type: string
        - name: tenant
          in: query
          required: false
          description: Tenant slug (or id) to search in.
          schema:
            type: string
        - name: tree
          in: query
          required: false
          description: "`TENANT/TREE`, or a tree name together with `tenant`."
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Path glob restricting the files searched (as for `searchCode`).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of symbols (clamped to 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - $ref: "#/components/parameters/CodeSearchBranch"
        - $ref: "#/components/parameters/CodeSearchBranches"
      responses:
        "200":
          description: The ranked symbols.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/code-index:
    get:
      operationId: getCodeIndexStatus
      summary: Code index status
      description: |
        v0.7 (§15.9). Server admins only. The persistent code search index:
        format version, memory use against `--code-index-memory`, segments
        loaded, builds and disk loads since the server started, and per
        indexed tree its default-branch counts (files, bytes, symbols),
        `built_at`, branch count, distinct segments, memory and disk bytes
        and each indexed branch (tip, manifest, loaded, building, error).
        Indexes of trees deleted while the server was down are dropped.
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: The index status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeIndexStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/code-index/rebuild:
    post:
      operationId: rebuildCodeIndex
      summary: Rebuild the code index
      description: |
        v0.7 (§15.9). Server admins only. Discards the index of one tree
        (`tree=TENANT/TREE`) or of every indexed tree (no `tree`) in memory
        and on disk, and rebuilds the branches that were indexed (the
        default branch when none was) from the object store before
        answering. Audited as `code_index.rebuild`.
      tags: [Admin]
      x-wt-action: server:admin
      parameters:
        - name: tree
          in: query
          required: false
          description: "`TENANT/TREE` to rebuild; omit to rebuild every indexed tree."
          schema:
            type: string
      responses:
        "200":
          description: The rebuilt trees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeIndexRebuildResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/gc:
    post:
      operationId: runGC
      summary: Run garbage collection
      description: |
        Runs one garbage-collection pass now (mark unreachable objects, delete
        those past the grace period, apply staged and audit retention). The
        run continues when the client disconnects. A run that fails part-way
        answers 500 with the partial report.
      tags: [Admin]
      x-wt-action: server:admin
      parameters:
        - name: dry_run
          in: query
          required: false
          description: Only report what would be marked and deleted.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The run report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`gc_running`: another run is in progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The run failed part-way; the body is the partial report (its `error` field is set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCReport"
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      operationId: gcStatus
      summary: Garbage-collection status
      description: The collector configuration, whether a run is in progress, the next scheduled run and the last runs (at most 20).
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: Collector status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/fsck:
    post:
      operationId: fsck
      summary: Check server integrity
      description: |
        v0.6 (§14.6). Re-hashes every stored object (when the object store
        can list its objects) and walks every snapshot reachable from a
        branch tip or tag of any tree, checking that its manifest, blobs,
        chunk lists and chunks are present and decode. Read-only; problems
        are reported in the body, not as an error status.
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: The integrity report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsckReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---- storage-backends (§15.2): server backups ----
  /api/v1/admin/backups:
    post:
      operationId: createBackup
      summary: Create a backup
      description: |
        v0.7 (§15.2). Writes a backup now and answers when it is complete:
        a consistent snapshot of the metadata database plus every object,
        streamed into `<data>/backups/<id>.wtbak` (a zstd-compressed tar
        holding `meta.db`, `objects/<2-hex>/<62-hex>` and `manifest.json`).
        Works with the disk and the S3 object store. The backup continues
        when the client disconnects. The body is optional. Restore is
        offline: `worktree-server restore --data DIR FILE`.
      tags: [Admin]
      x-wt-action: server:admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupRequest"
      responses:
        "201":
          description: The backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`backup_running`: another backup is being written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      operationId: listBackups
      summary: List backups
      description: |
        v0.7 (§15.2). The backup configuration (directory, schedule, keep
        count), the object store being backed up, whether a backup is
        running, the next scheduled run and every backup, newest first.
        Archives found in the backup directory without an index entry (for
        example after a restore) are listed with what their file reveals.
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: Backup status and backups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/backups/{id}/download:
    parameters:
      - $ref: "#/components/parameters/BackupID"
    get:
      operationId: downloadBackup
      summary: Download a backup
      description: v0.7 (§15.2). The `.wtbak` archive as an attachment; `Range` requests are supported.
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: The archive.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "206":
          description: The requested range of the archive.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/admin/backups/{id}:
    parameters:
      - $ref: "#/components/parameters/BackupID"
    delete:
      operationId: deleteBackup
      summary: Delete a backup
      description: v0.7 (§15.2). Removes the archive and its index entry.
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  # ---- end storage-backends ----
  /api/v1/admin/tenants/{tenant}/limits:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getLimits
      summary: Get a tenant's limits
      description: The tenant's own limit overrides (zero values = server default).
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: The tenant's limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLimits"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putLimits
      summary: Replace a tenant's limits
      description: The body replaces the tenant's limits (`{}` clears them). Values must not be negative. Audited.
      tags: [Admin]
      x-wt-action: server:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLimits"
      responses:
        "200":
          description: The stored limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLimits"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/usage:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: usage
      summary: Tenant usage and limits
      tags: [Tenants]
      x-wt-action: tenant:read
      responses:
        "200":
          description: Usage counters with the tenant's and the effective limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/archive/{snapshot}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: snapshot
        in: path
        required: true
        description: Snapshot id of the tree, or a branch name (its tip).
        schema:
          type: string
    get:
      operationId: archive
      summary: Download a snapshot archive
      description: |
        Streams a license-aware archive of the snapshot. Paths the caller may
        not redistribute (license rules) or read (path-deny policies) are
        omitted; a generated `LICENSES/NOTICE` lists the SPDX id of every
        included path covered by a license rule. Audited as `tree.export`.
      tags: [Snapshots]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          description: Archive format (`tgz` is accepted as `tar.gz`).
          schema:
            type: string
            enum: [tar.gz, tgz, zip]
            default: tar.gz
      responses:
        "200":
          description: "The archive (`Content-Disposition: attachment; filename=<tree>-<id12>.<format>`)."
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Archive-Omitted:
              description: Number of files left out because the caller may not export them.
              schema:
                type: integer
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/todos:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listTodos
      summary: List TODOs
      tags: [Todos]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: "Comma-separated statuses (`open`, `in_progress`, `done`, `cancelled`), or `active` (= open,in_progress) or `all`. Default all."
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Only TODOs whose target branch is this branch.
          schema:
            type: string
        - name: assignee
          in: query
          required: false
          description: Only TODOs assigned to this username; `me` is the caller (requires authentication).
          schema:
            type: string
      responses:
        "200":
          description: The TODOs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createTodo
      summary: Create a TODO
      description: Creates a manual TODO (status `open`, next number of the tree); publishes `todo.created`.
      tags: [Todos]
      x-wt-action: tree:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoCreateRequest"
      responses:
        "201":
          description: The new TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/todos/{n}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: TODO number (positive integer).
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getTodo
      summary: Get a TODO
      tags: [Todos]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: patchTodo
      summary: Update a TODO
      description: Updates title, details, priority, blocking and/or status. Closing sets `closed_at`; reopening clears `closed_at` and `resolved_by`. Publishes `todo.updated`.
      tags: [Todos]
      x-wt-action: tree:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoPatchRequest"
      responses:
        "200":
          description: The updated TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/todos/{n}/claim:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: TODO number (positive integer).
        schema:
          type: integer
          minimum: 1
    post:
      operationId: claimTodo
      summary: Claim a TODO
      description: Assigns the TODO to the caller and sets it `in_progress`. Publishes `todo.updated`.
      tags: [Todos]
      x-wt-action: tree:write
      responses:
        "200":
          description: The claimed TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the TODO is already done or cancelled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/todos/{n}/complete:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: TODO number (positive integer).
        schema:
          type: integer
          minimum: 1
    post:
      operationId: completeTodo
      summary: Complete a TODO
      description: Marks the TODO `done`, optionally recording the resolving snapshot (`snapshot` is a revision of the tree). The body is optional. Publishes `todo.updated`.
      tags: [Todos]
      x-wt-action: tree:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTodoRequest"
      responses:
        "200":
          description: The completed TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the TODO is already done."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/todos/{n}/cancel:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: TODO number (positive integer).
        schema:
          type: integer
          minimum: 1
    post:
      operationId: cancelTodo
      summary: Cancel a TODO
      description: Marks the TODO `cancelled`. Publishes `todo.updated`.
      tags: [Todos]
      x-wt-action: tree:write
      responses:
        "200":
          description: The cancelled TODO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the TODO is already done or cancelled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/dependencies:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: dependencies
      summary: Dependency report
      description: Outgoing dependencies declared by snapshots of the branch (with the TODOs they created) and the TODOs other trees created in this tree.
      tags: [Todos]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch name (default the tree's default branch).
          schema:
            type: string
      responses:
        "200":
