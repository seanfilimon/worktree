      properties:
        id:
          type: string
        webhook_id:
          type: string
        event:
          type: string
        payload:
          description: "Any JSON value."
        attempts:
          type: integer
        status_code:
          type: integer
        response:
          type: string
          description: "first 2 KiB of the response body"
        error:
          type: string
        duration_ms:
          type: integer
          format: int64
        succeeded:
          type: boolean
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        next_retry_at:
          type: string
          format: date-time
        redelivery:
          type: boolean
    WebhookDeliveryList:
      type: object
      description: "Body of GET .../webhooks/{id}/deliveries (newest first)."
      required: [deliveries]
      properties:
        deliveries:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/WebhookDelivery"
    WebhookList:
      type: object
      description: "Body of GET .../webhooks (oldest first)."
      required: [webhooks]
      properties:
        webhooks:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Webhook"
