          items:
            $ref: "#/components/schemas/MergeConflict"
          description: "v0.6 (§14.1): the conflicts of the three-way merge when the branches diverged (empty otherwise)."
    MergeConflict:
      type: object
      description: "Conflict is one path a server-side merge cannot resolve (review.Conflict). Tree is set for linked-group merges (\"tenant/tree\")."
      required: [path, kind]
      properties:
        tree:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [content, modify_delete, add_add, binary, chunked, executable, file_directory]
          description: "content: both sides changed overlapping lines of a text file; modify_delete: one side modified, the other deleted; add_add: both sides added the path with different content; binary / chunked: a binary or chunked (large) file changed on both sides; executable: same content added with different executable bits; file_directory: the merged tree would hold a file and a directory at one path."
    MergeConflictError:
      type: object
      description: "mergeConflictBody is the 409 merge_conflict response: the standard error envelope plus the conflicting paths, both at the top level and inside \"error\"."
      required: [error, conflicts]
      properties:
        error:
          $ref: "#/components/schemas/MergeConflictErrorDetail"
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
    MergeConflictErrorDetail:
      type: object
      description: "The `error` member of a merge_conflict response (`code` = `merge_conflict`)."
      required: [code, message, conflicts]
      properties:
        code:
          type: string
        message:
          type: string
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
    MergeGroupRequest:
      type: object
      description: "Optional body of POST /tenants/{tenant}/linked-groups/{id}/merge (an anonymous struct in the handler)."
      properties:
        method:
          type: string
          enum: ["", fast-forward, merge, squash]
          description: "Merge method for every member; empty = each member's default method."
    MergeMRRequest:
      type: object
      description: "mergeMRRequest is the optional body of POST .../merge-requests/{n}/merge."
      properties:
        method:
          type: string
          enum: ["", fast-forward, merge, squash]
          description: "Merge method; empty = the default, the first of fast-forward, merge, squash that is allowed and possible (see the mergeability endpoint)."
        message:
          type: string
          description: "Snapshot message of a merge or squash (at most 64 KiB of UTF-8; default \"Merge branch '<source>' into <target> (!N)\" for merge, the merge request title for squash). Ignored by fast-forward."
    MergeRequest:
      type: object
      properties:
        id:
          type: string
        tree_id:
          type: string
        number:
          type: integer
          description: "per-tree, starts at 1"
        title:
          type: string
        description:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        author_id:
          type: string
        author:
          type: string
        state:
          type: string
        approvals:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Approval"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time
        merged_snapshot:
          type: string
        linked_group:
          type: string
          description: "v0.5 (§13)."
        merge_method:
          type: string
          description: "v0.6 (§14.1): the method used to merge: `fast-forward`, `merge` or `squash` (empty on open and closed requests, and on requests merged before v0.6, which were fast-forwarded)."
    Mergeability:
      type: object
      description: "Mergeability reports which merge methods can merge a merge request (review.Mergeability). It does not consider approvals, CI or TODOs (see the checks endpoint)."
      required: [fast_forward, up_to_date, methods, default, allowed, conflicts, reasons]
      properties:
        fast_forward:
          type: boolean
          description: "FastForward is true when the target can be fast-forwarded to the source (or already contains it), whatever the protection allows."
        up_to_date:
          type: boolean
          description: "UpToDate is true when the target already contains the source."
        methods:
          type: [array, "null"]
          items:
            type: string
          description: "Methods lists the methods that are allowed and possible, in preference order; Default is the first of them (\"\" = none)."
        default:
          type: string
        allowed:
          type: [array, "null"]
          items:
            type: string
          description: "Allowed lists the methods branch protection allows."
        merge_base:
          type: string
          description: "MergeBase is the best common ancestor of target and source tips."
        conflicts:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/MergeConflict"
          description: "Conflicts of the three-way merge (empty when it is clean or when the target can be fast-forwarded)."
        reasons:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: "Reasons explains, per method, why it is not offered."
