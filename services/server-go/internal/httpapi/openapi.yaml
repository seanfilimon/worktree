        number:
          type: integer
          description: "per-tree, starts at 1"
        title:
          type: string
        description:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        author_id:
          type: string
        author:
          type: string
        state:
          type: string
        approvals:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Approval"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        merged_at:
          type: string
          format: date-time
        merged_snapshot:
          type: string
        linked_group:
          type: string
          description: "v0.5 (§13)."
        merge_method:
          type: string
          description: "v0.6 (§14.1): the method used to merge: `fast-forward`, `merge` or `squash` (empty on open and closed requests, and on requests merged before v0.6, which were fast-forwarded)."
        draft:
          type: boolean
          description: "v0.7 (§15.7): draft merge requests cannot be merged (`409 draft`) until marked ready."
        reviewers:
          type: array
          items:
            type: string
          description: "v0.7 (§15.7): requested reviewers, `user:NAME` or `team:SLUG` (explicit requests and the owners of the changed paths)."
