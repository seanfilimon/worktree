      properties:
        branch:
          type: string
        authors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/StagedAuthorActivity"
        files_changed:
          type: integer
        latest_at:
          type: string
          format: date-time
        overlaps:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/StagedFileOverlap"
    StagedFileOverlap:
      type: object
      required: [path, authors, branches]
      properties:
        path:
          type: string
        authors:
          type: [array, "null"]
          items:
            type: string
        branches:
          type: [array, "null"]
          items:
            type: string
    StagedFilesResponse:
      type: object
      description: "stagedFilesResponse is the body of GET {tree}/staged/{snapshot}/files."
      required: [staged, files, restricted_count]
      properties:
        staged:
          $ref: "#/components/schemas/StagedSnapshot"
        files:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/FileEntry"
          description: "The files of the working manifest, sorted by path."
        restricted_count:
          type: integer
          description: "RestrictedCount is the number of files left out of Files because the caller may not read them (path policies or license rules, §13.1)."
    StagedSnapshot:
      type: object
      description: "StagedSnapshot is a WIP snapshot visible to the team but not part of branch history. At most one per (tree, account, branch): a newer stage replaces the older one."
      required: [snapshot_id, tree_id, tenant_id, account_id, author, branch_name, files_changed, files_added, files_modified, files_deleted, message, staged_at]
      properties:
        snapshot_id:
          type: string
        tree_id:
          type: string
        tenant_id:
          type: string
        account_id:
          type: string
        author:
          type: string
        branch_name:
          type: string
        files_changed:
          type: [array, "null"]
          items:
            type: string
        files_added:
          type: integer
        files_modified:
          type: integer
        files_deleted:
          type: integer
        message:
          type: string
        staged_at:
          type: string
          format: date-time
        manifest_hash:
          type: string
          description: "v0.5: hex BLAKE3 of the staged working manifest (\"\" when the client sent none). It keeps the staged content alive and downloadable."
    Suggestion:
      type: object
      description: "Suggestion is a change proposed by a merge request comment: lines start_line..end_line (1-based, inclusive) of path as of snapshot_id are replaced by replacement. Applying it writes a snapshot on the source branch (applied_snapshot)."
      required: [path, start_line, end_line, replacement, snapshot_id]
      properties:
        path:
          type: string
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        replacement:
          type: string
        snapshot_id:
          type: string
        applied_snapshot:
          type: string
        applied_by:
          type: string
          description: "username"
        applied_at:
          type: string
          format: date-time
    SuggestionInput:
      type: object
      description: "SuggestionInput is the suggestion of a new comment (review.SuggestionInput)."
      required: [path, start_line, end_line, replacement]
      properties:
        path:
          type: string
        start_line:
          type: integer
          minimum: 1
        end_line:
          type: integer
          minimum: 1
        replacement:
          type: string
          description: "replaces the lines; a missing final newline is added; empty deletes them"
        snapshot_id:
          type: string
          description: "SnapshotID defaults to the comment's snapshot, else the source tip."
    SymbolHit:
      type: object
      description: "SymbolHit is one symbol found by a symbol search."
      required: [tenant, tree, branch, snapshot_id, path, line, name, kind, signature, language, match]
      properties:
        tenant:
          type: string
        tree:
          type: string
        branch:
          type: string
        snapshot_id:
          type: string
        path:
          type: string
        line:
          type: integer
          description: "1-based"
        name:
          type: string
        kind:
          type: string
          enum: [function, method, class, struct, interface, trait, enum, type, const]
          description: "function, method, class, struct, interface, trait, enum, type or const"
        container:
          type: string
          description: "Container is the enclosing type of a method (or nested declaration)."
        signature:
          type: string
          description: "Signature is the defining line, trimmed (at most 200 bytes)."
        language:
          type: string
          description: "go, rust, typescript, javascript, python, java, c or cpp"
        match:
          type: string
          enum: [exact, prefix, substring]
          description: "Match is how the name matched the query: exact, prefix or substring."
    SymbolSearchResult:
      type: object
      description: "SymbolResult is the answer to a symbol search. Symbols are ranked (exact, prefix, substring; then shorter names first) and then ordered by name, tenant, tree, branch, path and line."
      required: [symbols, truncated, searched_trees]
      properties:
        symbols:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/SymbolHit"
        truncated:
          type: boolean
          description: "Truncated reports that more than limit symbols matched, or the time budget ran out."
        searched_trees:
          type: integer
    SystemInfo:
