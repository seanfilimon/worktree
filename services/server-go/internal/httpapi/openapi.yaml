          type: boolean
        allowed_taggers:
          type: array
          items:
            type: string
          description: "usernames; empty = tree:write"
        require_signed:
          type: boolean
          description: "v0.7: matching tags must carry a verified signature (unsigned tags are refused with `signature_required`)."
