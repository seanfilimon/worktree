        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPolicy
      summary: Create a policy
      description: "`enabled` defaults to true; at most 100 statements, validated by the authorization engine. Server-managed fields (`id`, `version`, `created_at`, ...) are accepted and ignored. Records history version 1 and publishes `policy.changed` (v0.6). Audited as `policy.create`."
      tags: [IAM]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "201":
          description: The created policy (version 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a policy with this name (case-insensitive) already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tenants/{tenant}/policies/validate:
