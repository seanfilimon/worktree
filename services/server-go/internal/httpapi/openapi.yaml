      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by state; empty or `all` lists every merge request.
          schema:
            type: string
            enum: [open, merged, closed, all]
      responses:
        "200":
          description: Merge requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMR
      summary: Open a merge request
      description: |
        Opens a merge request from `source_branch` into `target_branch`
        (both must exist and differ). The HTTP layer requires `tree:read`;
        the review service checks `mr:create`. Publishes `mr.opened`;
        audited by the review service. v0.7 (§15.7): `draft` opens a draft
        (not mergeable until `POST .../ready`); `reviewers` requests
        reviewers; a non-draft merge request also requests the owners of
        its changed paths (`mr.review_requested`).
      tags: [MergeRequests]
      x-wt-action: mr:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMRRequest"
      responses:
        "201":
          description: Merge request opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}:
