      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/comments/{id}/apply:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        description: Comment id (a comment with a `suggestion`).
        schema:
          type: string
    post:
      operationId: applySuggestion
      summary: Apply a suggested change
      description: |
        v0.7 (§15.7). Writes a snapshot on the merge request's source branch
        (parent: the source tip; authored and pushed by the caller) whose
        file is the suggested version, marks the suggestion applied
        (`applied_snapshot`, `applied_by`, `applied_at`) and the comment
        resolved. Needs `tree:write` and a direct push to the source branch
        allowed by its protection; path ACLs, the tenant storage quota and
        signature requirements apply like for a push. When the source tip
        changed the suggested lines since the suggestion was made the answer
        is `409 suggestion_outdated` (edits elsewhere in the file are merged
        line-wise). Already applied suggestions, merge requests that are not
        open and a source that moved concurrently answer `409 conflict`; the
        storage quota `409 quota_exceeded`. Publishes `branch.pushed` and
        `mr.suggestion_applied` `{"number","comment_id","path","snapshot_id","applied_by"}`;
        audited as `mr.suggestion_apply`.
      tags: [MergeRequests]
      x-wt-action: tree:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplySuggestionRequest"
      responses:
        "200":
          description: The applied comment and the new snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppliedSuggestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`suggestion_outdated`, `quota_exceeded` or `conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/ready:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: markMRReady
      summary: Mark a draft ready for review
      description: |
        v0.7 (§15.7). Clears `draft`, requests the owners of the changed
        paths as reviewers (`mr.review_requested`) and publishes `mr.ready`.
        The author may mark their own merge request ready; others need
        `mr:merge`. A merge request that is not a draft is returned
        unchanged. Audited as `mr.ready`.
      tags: [MergeRequests]
      x-wt-action: [self, 'mr:merge']
      responses:
        "200":
          description: The merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/reviewers:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: requestReviewers
      summary: Request reviewers
      description: |
        v0.7 (§15.7). Adds review requests (`user:NAME`, `team:SLUG`; also
        `@NAME`, `@TENANT/TEAM`) to an open merge request. Users and teams
        (of the tree's tenant) must exist; the author cannot be requested.
        The author or a caller with `mr:approve` may request. Publishes
        `mr.review_requested` `{"number","reviewers","requested_by"}` with
        the newly requested reviewers; audited as `mr.review_request`.
      tags: [MergeRequests]
      x-wt-action: [self, 'mr:approve']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewersRequest"
      responses:
        "200":
          description: The merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: removeReviewers
      summary: Withdraw review requests
      description: |
        v0.7 (§15.7). Removes review requests named by `?reviewer=`
        (repeatable) or a `ReviewersRequest` body. The author or a caller
        with `mr:approve` may remove. Audited as `mr.review_request_remove`.
      tags: [MergeRequests]
      x-wt-action: [self, 'mr:approve']
      parameters:
        - name: reviewer
          in: query
          required: false
          description: A reviewer to remove (repeatable).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewersRequest"
      responses:
        "200":
          description: The merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/owners:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getMROwners
      summary: Owners of the changed paths
      description: |
        v0.7 (§15.7). Every path the merge request changes (relative to the
        merge base with the target), its owners and whether one of them
        approved the current source tip. `required` reports the target's
        `require_owner_approval`; `missing` lists owned paths without an
        owner approval.
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Owners per changed path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MROwners"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/owners:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: getOwners
      summary: Get the path owners of a tree
      description: |
        v0.7 (§15.7). The server configuration (`source: config`), else the
        rules of the `OWNERS` file at the root of the default branch
        (`source: file`, with unparsable lines in `errors`), else none.
        Rules use the license-rule `**` glob syntax; the last matching rule
        wins. OWNERS lines are `pattern  @user @tenant/team ...`.
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The owner configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnersConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putOwners
      summary: Replace the path owners of a tree
      description: |
        v0.7 (§15.7). Stores the server owner configuration (owners are
        normalized to `user:NAME` / `team:SLUG` and must exist); an empty
        `rules` list removes it so the OWNERS file applies again. Audited as
        `owners.update`.
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutOwnersRequest"
      responses:
        "200":
          description: The owner configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnersConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listGroups
      summary: List linked merge groups
      description: Linked groups of the tenant, newest first. Members of trees the caller cannot read show only `tree_id` and `mr_number`.
      tags: [MergeRequests]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Linked groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createGroup
      summary: Link merge requests
      description: |
        Creates a linked group of 2-50 open merge requests (`tree` =
        `tenant/tree`) that merge atomically. The caller needs `tenant:read`
        on the group's tenant, `tree:read` (unreadable trees answer 404) and
        `mr:merge` on every member tree. Members get `linked_group` set.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'tree:read', 'mr:merge']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: a member merge request is not open or already belongs to an open linked group."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Linked group id.
        schema:
          type: string
    get:
      operationId: getGroup
      summary: Get a linked group
      tags: [MergeRequests]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The linked group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: closeGroup
      summary: Close a linked group
      description: Closes the group (kept for history) and unlinks its members. Its creator may close it; anyone else needs `mr:merge` on every member tree.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'mr:merge']
      responses:
        "200":
          description: The closed group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/linked-groups/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Linked group id.
        schema:
          type: string
    post:
      operationId: mergeGroup
      summary: Merge a linked group
      description: |
        Merges every member atomically: all members must be mergeable with
        `method` (v0.6, §14.1; empty or no body = each member's default
        method). Merge and squash snapshots are written first, then the
        target tips move with compare-and-swap in order and are rolled back
        on failure. Requires `mr:merge` on every member tree. Publishes
        `group.merged`.
      tags: [MergeRequests]
      x-wt-action: ['tenant:read', 'mr:merge']
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeGroupRequest"
      responses:
        "200":
          description: The merged group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedGroupView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`merge_blocked`: a member is not mergeable (message names the blocker); `merge_method_not_allowed`: a member's protection refuses the method; `conflict`: the group is not open or a target moved (Error). `merge_conflict`: three-way conflicts are the only problem (MergeConflictError; each conflict carries its `tree`)."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MergeConflictError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/tag-protections:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listTagProtections
      summary: List tag protections
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Tag protection rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagProtection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: putTagProtection
      summary: Create or replace a tag protection
      description: Upserts the rule for `pattern` (a path.Match glob). `no_delete` forbids deleting matching tags, `no_move` replacing them; `allowed_taggers` (usernames) restricts who may create them (empty = anyone with `tree:write`). Audited as `tag_protection.update`.
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagProtection"
      responses:
        "200":
          description: The stored rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagProtection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteTagProtection
      summary: Delete a tag protection
      description: Audited as `tag_protection.delete`.
      tags: [Trees]
      x-wt-action: tree:admin
      parameters:
        - name: pattern
          in: query
          required: true
          description: Pattern of the rule to delete.
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/tenants/{tenant}/access-config:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenantAccessConfig
      summary: Get the tenant access document
      description: The last applied declarative access document of the tenant (`content` is the canonical JSON, base64-encoded).
      tags: [Access]
      x-wt-action: iam:read
      responses:
        "200":
          description: The last applied document.
