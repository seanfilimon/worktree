  /api/v1/admin/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    patch:
      operationId: adminPatchTenant
      summary: Set a tenant's status
      description: |
        Sets `status` (`active`, `suspended`, `deactivated`) and/or
        `status_reason`. Suspended tenants are read-only and deactivated
        ones refuse all access (server admins excepted); nothing is revoked,
        so resuming restores everything. Setting `active` without a reason
        clears the reason. Audited as `tenant.status`.
      tags: [Admin, Tenants]
      x-wt-action: server:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantStatusRequest"
      responses:
        "200":
          description: The updated tenant (`status` "" means active).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tenants/{tenant}/webhooks:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listTenantWebhooks
      summary: List tenant webhooks
      description: v0.6 (§14.2). The webhooks of the tenant, oldest first. Secrets are never returned (`has_secret` reports one).
      tags: [Webhooks]
      x-wt-action: tenant:admin
      responses:
        "200":
          description: The webhooks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createTenantWebhook
      summary: Create a tenant webhook
      description: |
        v0.6 (§14.2). Delivers the bus events of the tenant (every tree of it) whose
        type matches one of `events` to `url`: a JSON POST of the envelope
        `{id, event, tenant, tree?, actor?, at, payload}` with the headers
        `X-WT-Event`, `X-WT-Delivery`, `X-WT-Hook-ID` and
        `X-WT-Signature: sha256=<hex HMAC-SHA256 of the body>`. Failed
        deliveries are retried with backoff; a hook that keeps failing is
        deactivated (`webhook.failing`). Without `secret` the server
        generates one and returns it in this response only. At most 50
        webhooks per scope (409). Audited as `webhook.create`.
      tags: [Webhooks]
      x-wt-action: tenant:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The created webhook (with `secret` when it was generated).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the scope already has the maximum number of webhooks (50)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
