  /api/v1/trees/{tenant}/{tree}/merge-requests:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listMRs
      summary: List merge requests
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: Filter by state; empty or `all` lists every merge request.
          schema:
            type: string
            enum: [open, merged, closed, all]
      responses:
        "200":
          description: Merge requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createMR
      summary: Open a merge request
      description: |
        Opens a merge request from `source_branch` into `target_branch`
        (both must exist and differ). The HTTP layer requires `tree:read`;
        the review service checks `mr:create`. Publishes `mr.opened`;
        audited by the review service.
      tags: [MergeRequests]
      x-wt-action: mr:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMRRequest"
      responses:
        "201":
          description: Merge request opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number (per tree, from 1).
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getMR
      summary: Get a merge request
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/approve:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: approveMR
      summary: Approve a merge request
      description: |
        Records an approval of the current source tip (same as a review with
        decision `approved`). Authors cannot approve their own merge
        request. Publishes `mr.approved`.
      tags: [MergeRequests]
      x-wt-action: mr:approve
      responses:
        "200":
          description: The updated merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/merge:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: mergeMR
      summary: Merge a merge request
      description: |
        Moves the target branch to the source tip (fast-forward). Missing
        approvals answer `403 review_required`; other readiness failures
        (changes requested, CI, blocking TODOs, linear history) answer
        `409 merge_blocked`, members of a linked group `409 linked_group`,
        and a merge request that is not open or a diverged target
        `409 conflict`. Publishes `mr.merged`.
      tags: [MergeRequests]
      x-wt-action: mr:merge
      responses:
        "200":
          description: The merged merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or `review_required` when required approvals of the current source tip are missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`merge_blocked`, `linked_group` or `conflict`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/close:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: closeMR
      summary: Close a merge request
      description: The author may close their own merge request; others need `mr:merge`. Publishes `mr.closed`.
      tags: [MergeRequests]
      x-wt-action: [self, 'mr:merge']
      responses:
        "200":
          description: The closed merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/audit:
    get:
      operationId: audit
      summary: Query the audit log
      description: |
        With `tenant` the caller needs `tenant:admin` on it. Without one,
        server admins see every tenant's events and other accounts the
        merged events of the tenants they administer (empty if none).
        Newest first. `format=ndjson` streams every match (no limit) as
        `application/x-ndjson`.
      tags: [Audit]
      x-wt-action: ['tenant:admin', 'server:admin']
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant slug or id.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Exact action (`tree.create`) or a prefix pattern (`iam.*`).
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Inclusive lower bound (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Exclusive upper bound (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of events (clamped to 1000; ignored for ndjson).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, ndjson]
            default: json
      responses:
        "200":
          description: Matching audit events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
            application/x-ndjson:
              schema:
                type: string
                description: One AuditEvent JSON object per line.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events:
    get:
      operationId: events
      summary: Stream events (Server-Sent Events)
      description: |
        A `text/event-stream` of domain events, each frame
        `event: <type>\ndata: <Event JSON>\n\n`, with a heartbeat comment
        every 15 s. With `tree` (requires `tenant`) the caller needs
        `tree:read` on it; with only `tenant`, `tenant:read`; with neither,
        server admins get every event and other signed-in accounts the
        events of their member tenants. Browsers may pass the token as
        `?access_token=`.
      tags: [Events]
      x-wt-action: ['tree:read', 'tenant:read', authenticated]
      security:
        - {}
        - bearerAuth: []
        - accessTokenQuery: []
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant slug or id.
          schema:
            type: string
        - name: tree
          in: query
          required: false
          description: Tree name (requires tenant).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: Comma-separated event types (e.g. `branch.pushed,mr.opened`).
          schema:
            type: string
      responses:
        "200":
          description: The event stream (until the client disconnects or the server shuts down).
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data is an Event object.
              x-wt-event-schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
