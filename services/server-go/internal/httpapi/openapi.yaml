  /api/v1/trees/{tenant}/{tree}/blame/{rev}/{path}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: rev
        in: path
        required: true
        description: "Revision: a snapshot id, branch name, tag name or unique id prefix (one path segment, so branch names containing '/' must be given as a snapshot id)."
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: File path within the snapshot; may contain '/' (router wildcard `{path...}`). Must be clean and relative.
        schema:
          type: string
    get:
      operationId: blame
      summary: Blame a file
      description: |
        v0.6 (§14.4). Every line of the file at `rev`, attributed to the
        snapshot that last changed it, plus the snapshot `rev` resolved to.
        Read checks are those of the blob endpoint: `tree:read`, then a
        path-denied path answers 403 `path_denied` and a license-restricted
        one 451 `license_restricted`, before the file is looked up so that
        its existence is not revealed. An unknown revision or file answers
        404; an ambiguous id prefix or a bad line range (`end` before
        `start`, `start` past the last line) answers 400.
      tags: [Insights]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: false
          description: First line to return (1-based).
          schema:
            type: integer
            minimum: 1
        - name: end
          in: query
          required: false
          description: Last line to return (1-based, inclusive; clamped to the file's length).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The attributed lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlameResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or `path_denied` when an access policy denies reading the path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: "`payload_too_large`: the file is larger than 32 MiB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`binary_file`: the file is binary."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "451":
          $ref: "#/components/responses/UnavailableForLegalReasons"
  /api/v1/trees/{tenant}/{tree}/staged/summary:
    parameters:
