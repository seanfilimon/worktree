  /api/v1/search:
    get:
      operationId: search
      summary: Global search
      description: |
        Case-insensitive substring search over tenant slugs/names, tree
        names/descriptions, branch names and (server administrators only)
        account usernames/emails. The scope is the caller's member tenants
        (every tenant for server administrators) and, within them, the trees
        the caller may read. Each category holds at most `limit` hits.
      tags: [Search]
      x-wt-action: authenticated
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (1-100 characters).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          description: Maximum hits per category (clamped to 50).
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/gc:
    post:
      operationId: runGC
      summary: Run garbage collection
      description: |
        Runs one garbage-collection pass now (mark unreachable objects, delete
        those past the grace period, apply staged and audit retention). The
        run continues when the client disconnects. A run that fails part-way
        answers 500 with the partial report.
      tags: [Admin]
      x-wt-action: server:admin
      parameters:
        - name: dry_run
          in: query
          required: false
          description: Only report what would be marked and deleted.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The run report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`gc_running`: another run is in progress."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The run failed part-way; the body is the partial report (its `error` field is set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCReport"
        "501":
          $ref: "#/components/responses/NotImplemented"
    get:
      operationId: gcStatus
      summary: Garbage-collection status
      description: The collector configuration, whether a run is in progress, the next scheduled run and the last runs (at most 20).
      tags: [Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: Collector status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
