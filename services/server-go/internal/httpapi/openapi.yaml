          description: Tree name within `tenant` (requires `tenant`).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: Comma-separated event types to include (e.g. `branch.pushed,mr.opened`).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events (clamped to 200).
