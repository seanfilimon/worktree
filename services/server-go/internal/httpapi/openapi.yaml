          type: [array, "null"]
          items:
            $ref: "#/components/schemas/StagedSnapshot"
    UpdateCommentRequest:
      type: object
      description: "CommentPatch changes a comment (review.CommentPatch); omitted fields are left alone. At least one field is required."
      properties:
        body:
          type: string
        resolved:
          type: boolean
    ValidatePolicyRequest:
      type: object
      properties:
        statements:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/PolicyStatement"
    ValidatePolicyResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: object
      description: "ValidationErr is one problem found in a list of policy statements (POST /tenants/{t}/policies/validate)."
      required: [statement, field, message]
      properties:
        statement:
          type: integer
          description: "index into the statements array"
        field:
          type: string
          description: "e.g. \"actions[1]\", \"conditions.ip_ranges[0]\""
        message:
          type: string
    Webhook:
      type: object
