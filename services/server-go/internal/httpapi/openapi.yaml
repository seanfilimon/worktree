          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Snapshot"
        files:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/FileDiff"
        stats:
          $ref: "#/components/schemas/CompareStats"
        restricted_count:
          type: integer
          description: "RestrictedCount is the number of changed files left out of Files because the caller may not read them (§13.1)."
    CompareStats:
      type: object
