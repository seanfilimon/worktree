        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: mrChecks
      summary: Get merge readiness
      description: Evaluates required approvals, open change requests, required CI checks, blocking TODOs, linear history, divergence and linked-group membership.
      tags: [MergeRequests]
      x-wt-action: tree:read
