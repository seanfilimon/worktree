        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events:
    get:
      operationId: events
      summary: Stream events (Server-Sent Events)
      description: |
        A `text/event-stream` of domain events, each frame
        `event: <type>\ndata: <Event JSON>\n\n`, with a heartbeat comment
        every 15 s. With `tree` (requires `tenant`) the caller needs
        `tree:read` on it; with only `tenant`, `tenant:read`; with neither,
        server admins get every event and other signed-in accounts the
        events of their member tenants. Browsers may pass the token as
        `?access_token=`. `notification.created` events (§15.3) carry a
        `Notification` and are delivered only to its account, on streams
        without `tenant`/`tree`.
      tags: [Events]
      x-wt-action: ['tree:read', 'tenant:read', authenticated]
      security:
        - {}
        - bearerAuth: []
        - accessTokenQuery: []
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant slug or id.
          schema:
            type: string
        - name: tree
          in: query
          required: false
          description: Tree name (requires tenant).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: Comma-separated event types (e.g. `branch.pushed,mr.opened`).
          schema:
            type: string
      responses:
        "200":
          description: The event stream (until the client disconnects or the server shuts down).
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose data is an Event object.
              x-wt-event-schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
