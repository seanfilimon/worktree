        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/policies/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Policy id.
        schema:
          type: string
      - name: force
        in: query
        required: false
        description: "PUT / DELETE: `true` lets a tenant owner change a policy managed by a declarative access document."
        schema:
          type: boolean
    get:
      operationId: getPolicy
      summary: Get a policy
      tags: [IAM]
      x-wt-action: iam:read
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putPolicy
      summary: Replace a policy
      description: "Full replace; increments `version`. A non-zero `version` in the body must equal the stored version (optimistic concurrency). Records a history version and publishes `policy.changed` (v0.6). Audited as `policy.update`."
      tags: [IAM]
      x-wt-action: iam:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
      responses:
        "200":
          description: The updated policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: version mismatch or duplicate name; `managed_by_config`: owned by a declarative access document."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePolicy
      summary: Delete a policy
      description: "Records a `delete` history version (the history stays readable; rollback restores the policy) and publishes `policy.changed` (v0.6). Audited as `policy.delete`."
      tags: [IAM]
      x-wt-action: iam:admin
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`managed_by_config`: the policy is owned by a declarative access document (pass `?force=true` as a tenant owner)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tenants/{tenant}/policies/deleted:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listDeletedPolicies
      summary: List deleted policies
      description: v0.6 (§14.7). The latest history version (a `delete` change) of each deleted policy that has not been restored. Use rollback to restore one.
      tags: [IAM]
      x-wt-action: iam:read
      responses:
        "200":
          description: One version per deleted policy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/policies/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Policy id (live or deleted).
        schema:
          type: string
    get:
      operationId: listPolicyVersions
      summary: List a policy's versions
      description: |
        v0.6 (§14.7). Every stored revision of the policy, oldest first:
        each create, update, delete and rollback (through the REST API or a
        declarative access apply) appends one. A policy older than history
        recording has a synthetic version 1 (its current state). History
        stays readable after the policy is deleted; 404 when the policy has
        neither a live copy nor a history.
      tags: [IAM]
      x-wt-action: iam:read
      responses:
        "200":
          description: The versions, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/policies/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Policy id (live or deleted).
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: History version number (from 1).
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getPolicyVersion
      summary: Get a policy version
      description: v0.6 (§14.7).
      tags: [IAM]
      x-wt-action: iam:read
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/policies/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Policy id (live or deleted).
        schema:
          type: string
    get:
      operationId: diffPolicyVersions
      summary: Diff two policy versions
      description: |
        v0.6 (§14.7). Statement-level and field-level differences between
        two versions. `to` defaults to the latest version and `from` to the
        version before `to`. Version 0, and every `delete` version, stand
        for the empty policy.
      tags: [IAM]
      x-wt-action: iam:read
      parameters:
        - name: from
          in: query
          required: false
          description: Older version (0 = the empty policy; default `to` - 1).
          schema:
            type: integer
            minimum: 0
        - name: to
          in: query
          required: false
          description: Newer version (default the latest).
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The differences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/policies/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: id
        in: path
        required: true
        description: Policy id (live or deleted).
        schema:
          type: string
    post:
      operationId: rollbackPolicy
      summary: Roll a policy back to a version
      description: |
        v0.6 (§14.7). The policy's name, description, enabled flag and
        statements become those of `version`, recorded as a new `rollback`
        history version with the comment "rollback to version N[:
        comment]". A live policy's `version` is incremented as by PUT; a
        deleted policy is re-created with its id. The statements are
        validated against the current action catalogue (400) and the name
        must still be unique (409). Publishes `policy.changed`; audited as
        `policy.rollback`.
      tags: [IAM]
      x-wt-action: iam:admin
      parameters:
        - name: force
          in: query
          required: false
          description: "`true` lets a tenant owner roll back a policy managed by a declarative access document."
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackPolicyRequest"
      responses:
        "200":
          description: The new history version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the policy already matches the version, or another policy has its name; `managed_by_config`: owned by a declarative access document (pass `?force=true` as a tenant owner)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
