                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/openapi.yaml:
    get:
      operationId: openAPI
      summary: This OpenAPI document
      description: The OpenAPI 3.1 description of the REST API (embedded in the server binary). No authentication.
      tags: [Meta]
      x-wt-action: public
      security:
        - {}
      responses:
        "200":
          description: The document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/trees/{tenant}/{tree}/compare:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: compare
      summary: Compare two revisions
      description: |
        Compares `from` with `to`: the snapshots in `to` but not in `from`
        (oldest first, at most 250), the merge base when the histories
        diverged, and per-file differences sorted by path. `from` defaults to
        the first parent of `to`; a root snapshot is compared with nothing
        (`from` null, every file added). Patches are unified diffs for text
        files whose sides are at most 1 MiB (within a 32 MiB per-request
        budget); larger files are reported with `too_large`, binary files with
        `binary`. Paths the caller may not read (path-deny policies, license
        rules) are omitted and counted in `restricted_count`.
      tags: [Insights]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: to
          in: query
          required: true
          description: "Revision: snapshot id, branch name, tag name or unique id prefix (at least 4 characters)."
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Revision to compare against (default the first parent of `to`).
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: Context lines of the patches (non-negative, clamped to 1000).
          schema:
            type: integer
            minimum: 0
            default: 3
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/history:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: fileHistory
      summary: History of one file
      description: |
        Snapshots on the branch's history (newest first) that added, modified
        or deleted `path`, each compared with its first parent. At most 10000
        snapshots are inspected. An empty list when the default branch has no
        snapshots yet.
      tags: [Insights]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          description: Clean relative file path ('/'-separated).
          schema:
            type: string
        - name: branch
          in: query
          required: false
          description: Branch name (default the tree's default branch).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of entries (clamped to 1000).
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: File history entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileHistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or `path_denied` when an access policy denies reading the path."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "451":
          $ref: "#/components/responses/UnavailableForLegalReasons"
  /api/v1/trees/{tenant}/{tree}/stats:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: treeStats
      summary: Tree statistics
      description: |
        `snapshot_count`, `contributors` and `activity` cover the snapshots of
        the branch's history created within the last `days` UTC calendar days
        (today included; `activity` has one entry per day, oldest first).
        `file_count`, `total_bytes` and `languages` (top 10 by bytes, the rest
        as "Other") describe the branch tip.
      tags: [Insights]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch name (default the tree's default branch).
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Window in days (clamped to 365).
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/staged/summary:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: stagedSummary
      summary: Staged activity per branch
      description: The tree's staged (WIP) activity per branch, most recently active first, with files staged by more than one account listed as overlaps.
      tags: [Staged]
