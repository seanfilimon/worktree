            Content-Disposition:
              schema:
                type: string
            X-Archive-Omitted:
              description: Number of files left out because the caller may not export them.
              schema:
                type: integer
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
