  /api/v1/auth/providers:
    get:
      operationId: authProviders
      summary: List sign-in methods
      description: Reports whether password login, self-service registration and single sign-on are available. Used by the login page; SSO is reported as unavailable when its configuration cannot be loaded.
      tags: [SSO]
      x-wt-action: public
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Available sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sso/start:
    get:
      operationId: ssoStart
      summary: Start an SSO login
      description: |
        Browser navigation endpoint. Redirects to the identity provider's
        authorization URL (state + PKCE + nonce) and sets the single-use
        `wt_sso_state` cookie (HttpOnly, SameSite=Lax, path
        `/api/v1/auth/sso/`, 10 minutes) binding the login to this browser.
        Every failure (SSO disabled, bad redirect, provider error) also
        answers 302, to `/admin/login#sso_error=<message>`.
      tags: [SSO]
      x-wt-action: public
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: Same-origin path under `/admin/` to return to after login.
          schema:
            type: string
            default: /admin/
      responses:
        "302":
          description: Redirect to the identity provider, or to `/admin/login#sso_error=<message>` on failure.
          headers:
            Location:
              description: The identity provider's authorization URL, or the login page with `#sso_error`.
              schema:
                type: string
            Set-Cookie:
              description: "`wt_sso_state` (only when redirecting to the identity provider)."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/sso/callback:
    get:
      operationId: ssoCallback
      summary: Complete an SSO login
      description: |
        OpenID Connect redirect target. Verifies `state` against the
        `wt_sso_state` cookie (which is cleared whatever the outcome),
        exchanges the code and redirects to `<redirect>#sso_token=<token>`.
        Failures redirect to `/admin/login#sso_error=<message>`. Audits
        `sso.login` or `sso.login_failed`.
      tags: [SSO]
      x-wt-action: public
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from the identity provider.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: State issued by `/auth/sso/start`; must match the `wt_sso_state` cookie.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: OAuth error code reported by the identity provider.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to `<redirect>#sso_token=<token>` on success, else to `/admin/login#sso_error=<message>`.
          headers:
            Location:
              description: The post-login page with the session token in the fragment, or the login page with `#sso_error`.
              schema:
                type: string
            Set-Cookie:
              description: Clears `wt_sso_state`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/admin/sso:
    get:
      operationId: getSSOConfig
      summary: Get the SSO configuration
      description: The client secret is never returned (`has_client_secret` reports whether one is set).
      tags: [SSO, Admin]
      x-wt-action: server:admin
      responses:
        "200":
          description: The SSO configuration (zero configuration when unset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: single sign-on is not available on this server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: putSSOConfig
      summary: Replace the SSO configuration
      description: |
        Saves the OpenID Connect configuration. `client_secret` replaces the
        stored secret when present (omit it to keep the current one);
        `has_client_secret` and `updated_at` are accepted and ignored so a
        GET response can be sent back as is. Audited as `sso.config.update`.
      tags: [SSO, Admin]
      x-wt-action: server:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSSORequest"
      responses:
        "200":
          description: The saved configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: single sign-on is not available on this server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/review:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: reviewMR
      summary: Review a merge request
      description: |
        Records a review decision: `approved`, `changes_requested` or
        `commented`. Approve and request-changes need `mr:approve` (authors
        cannot review their own merge request, 403); the decision replaces
        the reviewer's previous one and records the current source tip, so
        approvals go stale when the source moves. `commented` needs only
        `tree:read` and a non-empty body; it adds a comment. Publishes
        `mr.reviewed` / `mr.commented`.
      tags: [MergeRequests]
      x-wt-action: ['tree:read', 'mr:approve']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: The updated merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the merge request is not open."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/checks:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
