        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/recent:
    get:
      operationId: recentEvents
      summary: Recent events
      description: |
        The most recent retained events the caller may see, oldest first.
        Scoping and authorization are those of `GET /api/v1/events`: with
        `tenant` and `tree` the caller needs `tree:read` on the tree, with
        `tenant` only `tenant:read` on the tenant; unscoped requests need a
        signed-in caller (server admins see every event, others the events of
        their member tenants). An empty list when the event bus keeps no
        history.
      tags: [Events]
      x-wt-action: ['tree:read', 'tenant:read', authenticated]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: tenant
          in: query
          required: false
          description: Tenant slug (or id) to scope to.
          schema:
            type: string
        - name: tree
          in: query
          required: false
          description: Tree name within `tenant` (requires `tenant`).
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: Comma-separated event types to include (e.g. `branch.pushed,mr.opened`).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events (clamped to 200).
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Events, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/branches/{name}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: name
        in: path
        required: true
        description: Branch name; may contain '/' (matched as a path wildcard).
        schema:
          type: string
    delete:
      operationId: deleteBranch
      summary: Delete a branch
      description: |
        Deletes the branch. Branch protection (the default branch, `no_delete`
        rules) is enforced; a refusal answers 403 with the denial kind as the
        error code (e.g. `branch_protection`). Audited as `branch.delete`;
        publishes `branch.deleted`.
      tags: [Trees]
      x-wt-action: branch:delete
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or a protection denial code such as `branch_protection`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/tags/{name}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: name
        in: path
        required: true
        description: Tag name; may contain '/' (matched as a path wildcard).
        schema:
          type: string
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: Deletes the tag (tag protections are enforced). Audited as `tag.delete`; publishes `tag.deleted`.
      tags: [Trees]
      x-wt-action: tree:admin
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`, or a tag protection denial."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: Change the caller's password
      description: |
        Verifies `current_password`, sets `new_password` and revokes every
        other token of the caller (the token of this request stays valid).
        Audited as `auth.password_change` (failures as
        `auth.password_change_failed`).
      tags: [Auth]
      x-wt-action: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`forbidden`: the current password is incorrect."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
