openapi: 3.1.0
info:
  title: W0rkTree REST API
  version: 0.6.0
  summary: JSON REST API of the W0rkTree server (`/api/v1`).
  description: |
    The REST API of the W0rkTree Go server (`services/server-go`). It serves
    the admin panel and the `wt` CLI's server-side commands; the sync
    protocol itself is gRPC (`worktree.sync.v1`) on the same listener.

    **Conventions** (see `crates/worktree-protocol/specs/server/RestApi.md`):

    * Request and response bodies are JSON (`application/json`), field names
      are the `json` tags of the Go types. Request bodies are limited to
      1 MiB, unknown fields are rejected (`400 bad_request`) and a
      `Content-Type` other than JSON answers `415 unsupported_media_type`.
    * Errors use one envelope: `{"error":{"code":"not_found","message":"..."}}`.
      Generic codes: `bad_request` (400), `unauthenticated` (401),
      `forbidden` (403), `not_found` (404), `method_not_allowed` (405),
      `conflict` (409), `payload_too_large` (413), `rate_limited` (429),
      `internal` (500), `not_implemented` (501). Feature-specific codes
      (`path_denied`, `license_restricted`, `merge_blocked`,
      `managed_by_config`, `quota_exceeded`, ...) are listed per operation.
    * Authentication: `Authorization: Bearer <token>` (session token,
      personal API token or service-account key). `GET` requests may pass
      the token as `?access_token=` instead (used by `EventSource`). A
      present but invalid token always answers 401, even on public routes.
    * `x-wt-action` names the authorization action checked by the
      operation (`tree:read`, `iam:admin`, ...). Special values:
      `public` (no check), `authenticated` (any signed-in principal),
      `self` (the caller's own account), `server:admin` (server
      administrators only).
    * Every response carries `X-Request-Id`; rate-limited responses carry
      `X-RateLimit-Limit` / `X-RateLimit-Remaining`.
  license:
    name: Apache-2.0
servers:
  - url: /
    description: The server this document was fetched from (paths are absolute).
security:
  - bearerAuth: []
tags:
  - name: Meta
    description: Health, metrics and this document.
  - name: Auth
    description: Registration, login, tokens, sessions, MFA, signing keys.
  - name: Tenants
    description: Tenants (organisations and personal namespaces) and members.
  - name: Trees
    description: Trees, branches, tags, protections and license rules.
  - name: Snapshots
    description: Snapshot history, file listings, blobs and archives.
  - name: Insights
    description: Compare, file history, blame, statistics and staged activity.
  - name: Staged
    description: Staged (work-in-progress) snapshots.
  - name: MergeRequests
    description: Merge requests, reviews, comments, checks and linked groups.
  - name: CI
    description: Commit status reports.
  - name: Todos
    description: Cross-tree dependency TODOs.
  - name: Releases
    description: Releases and release assets.
  - name: IAM
    description: Teams, roles, policies and their history, grants, service accounts, invitations, simulator.
  - name: Access
    description: Declarative access configuration.
  - name: SSO
    description: OpenID Connect single sign-on.
  - name: Audit
    description: Audit log.
  - name: Events
    description: Server-Sent Events and recent events.
  - name: Search
    description: Global search and code search.
  - name: Webhooks
    description: Tenant and tree webhooks and their delivery log.
  - name: Notifications
    description: Your notification inbox, settings and watch levels.
  - name: Admin
    description: Server administration (server administrators only).
paths:
  /healthz:
    get:
      operationId: health
      summary: Health check
      description: |
        Probes the metadata store and the object store. Not under `/api/v1`;
        exempt from rate limiting. `Cache-Control: no-store`.
      tags: [Meta]
      x-wt-action: public
      security:
        - {}
      responses:
        "200":
          description: Every probe passed (`status` = `ok`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A probe failed (`status` = `degraded`; `checks` names the failing probe).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      description: Prometheus text exposition format (version 0.0.4). Not under `/api/v1`; exempt from rate limiting.
      tags: [Meta]
      x-wt-action: public
      security:
        - {}
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register an account
      description: |
        Creates an account (and its personal tenant) and signs it in. Fails
        when self-service registration is disabled on the server. Audited as
        `auth.register`.
      tags: [Auth]
      x-wt-action: public
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; the session token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in
      description: |
        Exchanges a username and password for a session token. Accounts with
        MFA enabled get `{"mfa_required":true,"mfa_token":...}` instead;
        complete the login with `POST /api/v1/auth/login/mfa`. Wrong
        credentials answer 401 without revealing whether the username exists.
        Audited as `auth.login`, `auth.mfa_challenge` or `auth.login_failed`.
      tags: [Auth]
      x-wt-action: public
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, or a second factor is required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SessionResponse"
                  - $ref: "#/components/schemas/MFARequiredResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out
      description: |
        Revokes the bearer token used to authenticate this request
        (idempotent). Audited as `auth.logout`.
      tags: [Auth]
      x-wt-action: self
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Current account
      description: The caller's account and tenant memberships (sorted by tenant slug).
      tags: [Auth]
      x-wt-action: self
      responses:
        "200":
          description: The caller's account and memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/tokens:
    get:
      operationId: listTokens
      summary: List personal API tokens
      description: The caller's personal API tokens (sign-in sessions are listed by `GET /api/v1/auth/sessions`).
      tags: [Auth]
      x-wt-action: self
      responses:
        "200":
          description: The caller's API tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createToken
      summary: Create a personal API token
      description: |
        Creates a personal API token; the raw `token` is returned only once.
        `ttl_hours` 0 = no expiry (max 43800). Optional `scopes` (action
        patterns such as `tree:read`, `tree:*`) restrict the token; a scoped
        caller may only create tokens with a subset of its scopes. Service
        accounts cannot create personal tokens (403). Audited as `token.create`.
      tags: [Auth]
      x-wt-action: self
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "200":
          description: Token created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/auth/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Token id.
        schema:
          type: string
    delete:
      operationId: revokeToken
      summary: Revoke a personal API token
      description: Revokes one of the caller's tokens. Audited as `token.revoke`.
      tags: [Auth]
      x-wt-action: self
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: Every tenant for server administrators, otherwise the tenants the caller is a member of (sorted by slug).
      tags: [Tenants]
      x-wt-action: authenticated
      responses:
        "200":
          description: Visible tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTenant
      summary: Create an organisation tenant
      description: |
        Any signed-in account may create an organisation tenant (kind `org`,
        plan `free`) and becomes its owner. `name` defaults to the slug.
        Audited as `tenant.create`.
      tags: [Tenants]
      x-wt-action: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getTenant
      summary: Get a tenant
      tags: [Tenants]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchTenant
      summary: Update a tenant
      description: |
        Renames the tenant (`tenant:admin`) and/or changes its plan
        (`free|pro|enterprise`, server administrators only). At least one
        field is required. Audited as `tenant.update`.
      tags: [Tenants]
      x-wt-action: ['tenant:admin', 'server:admin']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTenantRequest"
      responses:
        "200":
          description: The updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/members:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listMembers
      summary: List tenant members
      description: Members with their accounts and roles, sorted by username.
      tags: [Tenants]
      x-wt-action: tenant:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{tenant}/members/{username}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - name: username
        in: path
        required: true
        description: Account username.
        schema:
          type: string
    put:
      operationId: putMember
      summary: Add a member or change a member's role
      description: |
        `role` is a built-in role (owner, admin, maintainer, developer,
        viewer) or a custom role of the tenant. Only owners (or server
        admins) grant or revoke `owner`; demoting the last owner answers
        `409 last_owner`. Adding a new member past the tenant's MaxMembers
        limit answers `409 quota_exceeded`. Audited as `member.update`.
      tags: [Tenants]
      x-wt-action: tenant:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutMemberRequest"
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`last_owner` (the tenant would be left without an owner) or `quota_exceeded` (MaxMembers)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteMember
      summary: Remove a member
      description: |
        Members may always remove themselves (an owner only while another
        owner remains); removing others needs `tenant:admin`, and removing
        an owner needs an owner or server admin. Removing the last owner
        answers `409 last_owner`. Audited as `member.remove`.
      tags: [Tenants]
      x-wt-action: [self, 'tenant:admin']
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`last_owner`: the tenant would be left without an owner."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tenants/{tenant}/trees:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listTrees
      summary: List a tenant's trees
      description: The trees of the tenant the caller may read (`tree:read` per tree; others are omitted), sorted by name, with counts.
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Readable trees.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTree
      summary: Create a tree
      description: |
        Creates a tree with an empty default branch. Defaults: visibility
        `private`, default_branch `main`. Exceeding the tenant's MaxTrees
        limit answers `409 quota_exceeded`. Audited as `tree.create`;
        publishes `tree.created`.
      tags: [Trees]
      x-wt-action: tree:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTreeRequest"
      responses:
        "201":
          description: Tree created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict` (the tree exists) or `quota_exceeded` (MaxTrees)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
  /api/v1/trees/{tenant}/{tree}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: getTree
      summary: Get a tree
      description: The tree with branch, snapshot, staged and open merge request counts.
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The tree summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchTree
      summary: Update a tree
      description: Changes description, visibility and/or default branch (at least one is required). Audited as `tree.update`.
      tags: [Trees]
      x-wt-action: tree:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchTreeRequest"
      responses:
        "200":
          description: The updated tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
    delete:
      operationId: deleteTree
      summary: Delete a tree
      description: Deletes the tree and its metadata. Audited as `tree.delete`; publishes `tree.deleted`.
      tags: [Trees]
      x-wt-action: tree:admin
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/branches:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listBranches
      summary: List branches
      description: Branches sorted by name.
      tags: [Trees]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The branches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createBranch
      summary: Create a branch
      description: |
        Creates a branch at `from` (a revision; default the default branch's
        tip, an empty branch when the tree has no snapshots). Audited as
        `branch.create`; publishes `branch.created`.
      tags: [Trees]
      x-wt-action: branch:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: The new branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict` when the branch exists, `quota_exceeded` when the tenant's branches-per-tree limit is reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/trees/{tenant}/{tree}/snapshots:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
    get:
      operationId: listSnapshots
      summary: Snapshot history of a branch
      description: |
        The history of a branch, newest first. Without `branch` the tree's
        default branch is used (an empty list when nothing has been pushed);
        an explicit unknown branch answers 404.
      tags: [Snapshots]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: branch
          in: query
          required: false
          description: Branch name (default the tree's default branch).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of snapshots (clamped to 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        "200":
          description: Snapshots, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/snapshots/{id}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: id
        in: path
        required: true
        description: Snapshot id.
        schema:
          type: string
    get:
      operationId: getSnapshot
      summary: Get a snapshot and its files
      description: |
        The snapshot and its manifest entries sorted by path. Files the
        caller may not read (path-deny policies, license rules) are left out
        and counted in `restricted_count`.
      tags: [Snapshots]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The snapshot detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trees/{tenant}/{tree}/blob/{snapshot}/{path}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: snapshot
        in: path
        required: true
        description: Snapshot id.
        schema:
          type: string
      - name: path
