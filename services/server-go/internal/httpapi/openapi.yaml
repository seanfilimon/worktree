      description: "Evaluates `action` for a principal (default the caller) on a tenant, tree, branch or path with the full policy engine and returns the Decision with its reasons. Inspecting principals other than the caller needs iam:read on the tenant. `candidate_policies` replaces the tenant's stored policies for this evaluation (dry run of a policy change; at most 200)."
      tags: [IAM]
