      summary: Replace the SSO configuration
      description: |
        Saves the OpenID Connect configuration. `client_secret` replaces the
        stored secret when present (omit it to keep the current one);
        `has_client_secret` and `updated_at` are accepted and ignored so a
        GET response can be sent back as is. Audited as `sso.config.update`.
      tags: [SSO, Admin]
      x-wt-action: server:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSSORequest"
      responses:
        "200":
          description: The saved configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`not_found`: single sign-on is not available on this server."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/review:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    post:
      operationId: reviewMR
      summary: Review a merge request
      description: |
        Records a review decision: `approved`, `changes_requested` or
        `commented`. Approve and request-changes need `mr:approve` (authors
        cannot review their own merge request, 403); the decision replaces
        the reviewer's previous one and records the current source tip, so
        approvals go stale when the source moves. `commented` needs only
        `tree:read` and a non-empty body; it adds a comment. Publishes
        `mr.reviewed` / `mr.commented`.
      tags: [MergeRequests]
      x-wt-action: ['tree:read', 'mr:approve']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: The updated merge request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`conflict`: the merge request is not open."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/checks:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: mrChecks
      summary: Get merge readiness
      description: |
        Evaluates required approvals, open change requests, required CI
        checks, blocking TODOs, linked-group membership and (v0.6, §14.1) the
        merge methods: `methods` lists the allowed and possible methods (the
        first is the default) and `conflicts` the three-way conflicts when
        the branches diverged. Divergence, linear history, conflicts and
        merge-method restrictions block only when no allowed method can
        merge.
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Merge readiness with every blocker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeChecks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/mergeability:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: mrMergeability
      summary: Get the possible merge methods
      description: |
        v0.6 (§14.1). Which merge methods branch protection allows and which
        of them can merge the request now (fast-forward possible, three-way
        merge clean), the merge base and the three-way conflicts, with a
        reason per method that is not offered. Approvals, CI and TODOs are
        not considered (see `GET .../checks`). Merge requests that are not
        open are answered too, every method with a reason. The three-way
        outcome is cached per (source tip, target tip).
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The merge methods and conflicts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mergeability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/trees/{tenant}/{tree}/merge-requests/{n}/comments:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/Tree"
      - name: n
        in: path
        required: true
        description: Merge request number.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listComments
      summary: List merge request comments
      tags: [MergeRequests]
      x-wt-action: tree:read
      security:
        - {}
        - bearerAuth: []
      responses:
